<style>

  --navy: #0b1e38;
  --navy-light: #162f55;

  --blue-hover: #1d4ed8;
  --blue-soft: #eff6ff;
  --sky: #0284c7;
  --green: #059669;
  --green-hover: #047857;
  --green-soft: #ecfdf5;
  --amber: #d97706;
  --amber-soft: #fffbeb;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --ink: #0f172a;
  --ink-secondary: #475569;
  --muted: #64748b;

* {

  -webkit-tap-highlight-color: transparent;
}

html, body {

#app {

  position: relative;
  max-width: 600px;

}
.header-brand {

  align-items: center;

}

  background: rgba(255,255,255,.12);

.brand-title {

}
.brand-subtitle {

.header-actions {

<body>
<div id="app"></div>
<div id="toast" class="toast-msg"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════
//  STATE & INITIALIZATION
// ══════════════════════════════════════════════════════════════════════════
let S = {
  view: 'home', // 'home' | 'daily' | 'customers' | 'reports' | 'history' | 'cDetail' | 'settings'
  customers: [],
  week: null,
  history: [],
  date: getTodayStr(), // current selected day in daily entry
  currentWs: null,     // start Thursday of active week
  searchQueryDaily: '',
  searchQueryReports: '',
  searchQueryCusts: '',
  modal: null, // 'add' | 'edit' | 'bulkAdd' | 'backup'
  editId: null,
  cDetailId: null,
  confirm: null
};

// ══════════════════════════════════════════════════════════════════════════
//  DATE & CYCLE MATH: THURSDAY TO WEDNESDAY (خميس لـ أربعاء)
// ══════════════════════════════════════════════════════════════════════════
// Days order: 0: خميس, 1: جمعة, 2: سبت, 3: أحد, 4: اثنين, 5: ثلاثاء, 6: أربعاء (يوم القبض)
const DAY_NAMES = ['الخميس', 'الجمعة', 'السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء'];
const MONTH_NAMES = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Get the Thursday start of the week for any date
// In JS: Sun=0, Mon=1, Tue=2, Wed=3, Thu=4, Fri=5, Sat=6
function getWeekStartThursday(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  // Diff to previous Thursday (4):
  const diff = (day - 4 + 7) % 7;
  const thur = new Date(d);
  thur.setDate(d.getDate() - diff);
  return thur.toISOString().split('T')[0];
}

// 7 days of the collection week:
// الخميس (Day 0) -> الجمعة (1) -> السبت (2) -> الأحد (3) -> الاثنين (4) -> الثلاثاء (5) -> الأربعاء (6 - يوم القبض والتصفية)
function getCycleDays(ws) {
  const days = [];
  const start = new Date(ws + 'T00:00:00');
  for (let i = 0; i < 7; i++) {
    const cur = new Date(start);
    cur.setDate(start.getDate() + i);
    days.push(cur.toISOString().split('T')[0]);
  }
  return days;
}

function formatDateAr(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
}

function getDayNameAr(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const jsDay = d.getDay();
  // Map JS Day to Arabic day name:
  const map = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  return map[jsDay];
}

function getCycleLabel(ws) {
  const days = getCycleDays(ws);

// ══════════════════════════════════════════════════════════════════════════
//  ARABIC FRACTIONS (الكسور بالعربي)
// ══════════════════════════════════════════════════════════════════════════
function formatKgArabic(val) {
  if (!val || isNaN(val) || val <= 0) return '0 كجم';
  const num = parseFloat(val);
  const intPart = Math.floor(num);
  const frac = parseFloat((num - intPart).toFixed(4));

  let fracWord = '';
  if (Math.abs(frac - 0.25) < 0.02) fracWord = 'وربع';
  else if (Math.abs(frac - 0.5) < 0.02) fracWord = 'ونصف';
  else if (Math.abs(frac - 0.75) < 0.02) fracWord = 'وتلات أرباع';
  else if (frac > 0) fracWord = `و${frac.toFixed(2)}`;

  if (intPart === 0) {
    if (Math.abs(frac - 0.25) < 0.02) return 'ربع كجم';
    if (Math.abs(frac - 0.5) < 0.02) return 'نصف كجم';
    if (Math.abs(frac - 0.75) < 0.02) return 'تلات أرباع كجم';
    return `${num.toFixed(2)} كجم`;
  }
  return fracWord ? `${intPart} ${fracWord} كجم` : `${intPart} كجم`;
}

function applyFraction(inputId, custId, fracVal) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  const curNum = parseFloat(inp.value.trim()) || 0;
  const intPart = Math.floor(curNum + 0.001);

  if (fracVal === 0) {
    inp.value = '';
  } else if (fracVal === 1) {
    inp.value = curNum > 0 ? (curNum + 1).toFixed(2).replace(/\.00$/, '') : '1';
  } else {
    inp.value = parseFloat((intPart + fracVal).toFixed(4));
  }
  handleMilkInput(custId);
}

// ══════════════════════════════════════════════════════════════════════════
//  INDEXED DB STORAGE
// ══════════════════════════════════════════════════════════════════════════
let _db;
function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('AbyDairyThursdayCycle', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('customers')) db.createObjectStore('customers', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('weeks')) db.createObjectStore('weeks', { keyPath: 'ws' });
    };
    req.onsuccess = e => { _db = e.target.result; resolve(); };
    req.onerror = reject;
  });
}

function dbTx(store, mode) { return _db.transaction(store, mode).objectStore(store); }
function dbGet(store, key) {
  return new Promise((res, rej) => {
    const q = dbTx(store, 'readonly').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = rej;
  });
}
function dbPut(store, val) {
  return new Promise((res, rej) => {
    const q = dbTx(store, 'readwrite').put(val);
    q.onsuccess = () => res();
    q.onerror = rej;
  });
}
function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const q = dbTx(store, 'readwrite').delete(key);
    q.onsuccess = () => res();
    q.onerror = rej;
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) => {
    const q = dbTx(store, 'readonly').getAll();
    q.onsuccess = () => res(q.result || []);
    q.onerror = rej;
  });
}

// ══════════════════════════════════════════════════════════════════════════
//  CALCULATIONS
// ══════════════════════════════════════════════════════════════════════════
function calcCustomerWeek(cust, week) {
  const days = getCycleDays(week.ws);
  const entries = week.entries || {};
  let cowKg = 0;
  let bufKg = 0;

  for (const d of days) {
    const e = (entries[cust.id] || {})[d] || {};
    if (e.cow && e.cow > 0) cowKg += e.cow;
    if (cust.buffOn && e.buf && e.buf > 0) bufKg += e.buf;
  }

  const cowRate = cust.cow || 0;
  const bufRate = cust.buff || 0;
  const cowAmt = cowKg * cowRate;
  const bufAmt = bufKg * bufRate;
  const total = cowAmt + bufAmt;

  return {
    cowKg,
    bufKg,
    totalKg: cowKg + bufKg,
    cowAmt,
    bufAmt,
    total
  };
}

async function loadData() {
  S.customers = await dbGetAll('customers');
  if (!S.customers.length) {
    try {
      const res = await fetch('customers.json');
      if (res.ok) {
        const json = await res.json();
        if (json.customers) {
          S.customers = json.customers;
          for (const c of S.customers) await dbPut('customers', c);
        }
      }
    } catch (e) {}
  }
  S.customers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));

  // Current active Thursday
  const curThursday = getWeekStartThursday(getTodayStr());
  S.currentWs = curThursday;

  let weekData = await dbGet('weeks', curThursday);
  if (!weekData) {
    weekData = { ws: curThursday, entries: {}, paid: {}, closed: false };
    await dbPut('weeks', weekData);
  }
  if (!weekData.paid) weekData.paid = {};
  S.week = weekData;

  S.history = await dbGetAll('weeks');
  S.history.sort((a, b) => b.ws.localeCompare(a.ws));
}

async function saveCustomers() {
  for (const c of S.customers) await dbPut('customers', c);
}
async function saveWeek() {
  if (S.week) await dbPut('weeks', S.week);
}

function handleMilkInput(custId) {
  const cust = S.customers.find(c => c.id === custId);
  if (!cust) return;

  const cowInp = document.getElementById(`cow-${custId}`);
  const bufInp = document.getElementById(`buf-${custId}`);

  const cowNum = cowInp ? (parseFloat(cowInp.value) || 0) : 0;
  const bufNum = bufInp ? (parseFloat(bufInp.value) || 0) : 0;

  const total = (cowNum * (cust.cow || 0)) + (cust.buffOn ? (bufNum * (cust.buff || 0)) : 0);

  const moneyEl = document.getElementById(`money-${custId}`);
  if (moneyEl) {
    moneyEl.textContent = total > 0 ? `${total.toFixed(2)} ج.م` : '';
  }

  // Update in state
  if (!S.week.entries[custId]) S.week.entries[custId] = {};
  if (!S.week.entries[custId][S.date]) S.week.entries[custId][S.date] = {};

  if (cowNum > 0) S.week.entries[custId][S.date].cow = cowNum;
  else delete S.week.entries[custId][S.date].cow;

  if (cust.buffOn && bufNum > 0) S.week.entries[custId][S.date].buf = bufNum;
  else delete S.week.entries[custId][S.date].buf;

  // Auto-save debounce
  clearTimeout(S._saveTimer);
  S._saveTimer = setTimeout(() => { saveWeek(); }, 800);
}

async function saveDayEntries() {
  S.customers.forEach(c => handleMilkInput(c.id));
  await saveWeek();
  showToast(`✅ تم حفظ بيانات يوم ${getDayNameAr(S.date)} بنجاح`, 'ok');
}

        <div class="form-grp">
          <label class="form-lbl">سعر لبن البقر (ج.م / كجم) - اختياري</label>
          <input class="form-ctl" id="custCow" type="number" step="0.5" placeholder="مثال: 15" value="${cust && cust.cow ? cust.cow : ''}">
        </div>
        <div class="form-grp">
          <label class="form-lbl">سعر لبن الجاموس (ج.م / كجم) - اختياري</label>
          <input class="form-ctl" id="custBuf" type="number" step="0.5" placeholder="مثال: 25" value="${cust && cust.buff ? cust.buff : ''}">
        </div>
        <button class="btn btn-primary" onclick="saveSingleCustomer()" style="margin-top: 8px;">
          ${isEdit ? '💾 حفظ التعديلات' : '✅ حفظ الزبون'}
        </button>
      `;

    case 'backup':
      return `
        <div class="modal-head">
          <div class="modal-title">💾 النسخ الاحتياطي للبيانات</div>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div style="font-size: 12px; color: var(--ink-secondary); margin-bottom: 12px; line-height: 1.5;">
          يمكنك تحميل نسخة احتياطية من كل الزباين والأسابيع لتأمينها أو نقلها لموبايل آخر:
        </div>
        <button class="btn btn-success" onclick="downloadBackup()" style="margin-bottom: 8px;">
          ⬇️ تحميل ملف النسخة الاحتياطية (JSON)
        </button>
        <button class="btn btn-outline" onclick="triggerRestoreInput()">
          ⬆️ استرجاع نسخة احتياطية من ملف
        </button>
      `;

    default:
      return '';
  }
}

function openModal(m) { S.modal = m; render(); }
function closeModal() { S.modal = null; S.editId = null; render(); }
function closeConfirm() { S.confirm = null; render(); }

// ══════════════════════════════════════════════════════════════════════════
//  BULK ADD IMPLEMENTATION
// ══════════════════════════════════════════════════════════════════════════
async function executeBulkAdd() {
  const box = document.getElementById('bulkNamesBox');
  const cowEl = document.getElementById('bulkCowPrice');
  const bufEl = document.getElementById('bulkBufPrice');

  const text = box ? box.value : '';
  const cowPrice = cowEl && cowEl.value ? parseFloat(cowEl.value) : 0;
  const bufPrice = bufEl && bufEl.value ? parseFloat(bufEl.value) : 0;

  const names = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

  if (names.length === 0) {
    showToast('⚠️ يرجى كتابة اسم زبون واحد على الأقل', 'warn');
    return;
  }

  let count = 0;
  for (const name of names) {
    S.customers.push({
      id: uid(),
      name: name,
      cow: cowPrice > 0 ? cowPrice : 0,
      buffOn: bufPrice > 0,
      buff: bufPrice > 0 ? bufPrice : 0,
      addedAt: getTodayStr()
    });
    count++;
  }

  S.customers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  await saveCustomers();
  closeModal();
  showToast(`✅ تمت إضافة ${count} زبون بنجاح وكل زبون مسجل لوحده!`, 'ok');
}

// ══════════════════════════════════════════════════════════════════════════
//  SINGLE CUSTOMER CRUD
// ══════════════════════════════════════════════════════════════════════════
function openEditModal(id) {
  S.editId = id;
  S.modal = 'edit';
  render();
}

async function saveSingleCustomer() {
  const nameEl = document.getElementById('custName');
  const cowEl = document.getElementById('custCow');
  const bufEl = document.getElementById('custBuf');

  const name = nameEl ? nameEl.value.trim() : '';
  const cow = cowEl && cowEl.value ? parseFloat(cowEl.value) : 0;
  const buf = bufEl && bufEl.value ? parseFloat(bufEl.value) : 0;

  if (!name) {
    showToast('❌ أدخل اسم الزبون', 'err');
    return;
  }

  if (S.modal === 'edit' && S.editId) {
    const idx = S.customers.findIndex(c => c.id === S.editId);
    if (idx !== -1) {
      S.customers[idx].name = name;
      S.customers[idx].cow = cow;
      S.customers[idx].buffOn = buf > 0;
      S.customers[idx].buff = buf;
      await saveCustomers();
      showToast('✅ تم تعديل بيانات الزبون', 'ok');
    }
  } else {
    S.customers.push({
      id: uid(),
      name,
      cow,
      buffOn: buf > 0,
      buff,
      addedAt: getTodayStr()
    });
    S.customers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    await saveCustomers();
    showToast('✅ تمت إضافة الزبون بنجاح', 'ok');
  }

  closeModal();
}

function confirmDeleteCustomer(id) {
  const c = S.customers.find(x => x.id === id);
  if (!c) return;
  S.confirm = {
    title: 'حذف الزبون',
    msg: `هل تريد حذف "${c.name}" نهائياً من السيستم؟`,
    icon: '🗑️',
    fn: `executeDeleteCustomer('${id}')`
  };
  render();
}

async function executeDeleteCustomer(id) {
  await dbDelete('customers', id);
  S.customers = S.customers.filter(c => c.id !== id);
  await saveCustomers();
  closeConfirm();
  showToast('🗑️ تم حذف الزبون', 'ok');
}

// ══════════════════════════════════════════════════════════════════════════
//  WEEK CLOSE & NAVIGATION
// ══════════════════════════════════════════════════════════════════════════
function confirmCloseWeek() {
  const w = S.week;
  const days = getCycleDays(w.ws);
  S.confirm = {
    title: '🔄 تصفية وإغلاق حساب الأسبوع',
    msg: `هل قمت بتسليم كل الزباين فلوسهم يوم الأربعاء (${formatDateAr(days[6])}) وتريد أرشفة الأسبوع وبدء أسبوع جديد من الخميس؟`,
    icon: '💰',
    btnClass: 'btn-success',
    fn: 'executeCloseWeek()'
  };
  render();
}

async function executeCloseWeek() {
  const curWeek = S.week;
  const archived = {
    ...curWeek,
    closed: true,
    closedAt: new Date().toISOString(),
    snapshot: JSON.parse(JSON.stringify(S.customers))
  };

  await dbPut('weeks', archived);

  // New week starts Thursday (7 days after old start Thursday)
  const nextThursdayObj = new Date(curWeek.ws + 'T00:00:00');
  nextThursdayObj.setDate(nextThursdayObj.getDate() + 7);
  const nextWs = nextThursdayObj.toISOString().split('T')[0];

  const newWeek = {
    ws: nextWs,
    entries: {},
    paid: {},
    closed: false
  };

  await dbPut('weeks', newWeek);
  S.week = newWeek;
  S.currentWs = nextWs;
  S.date = nextWs;
  S.history = await dbGetAll('weeks');
  S.history.sort((a, b) => b.ws.localeCompare(a.ws));

  closeConfirm();
  showToast('🎉 تم إغلاق الأسبوع بنجاح وبدء دورة الأسبوع الجديد (من الخميس)!', 'ok');
  goView('home');
}

async function navWeek(delta) {
  const d = new Date(S.currentWs + 'T00:00:00');
  d.setDate(d.getDate() + (delta * 7));
  const newWs = d.toISOString().split('T')[0];
  S.currentWs = newWs;

  let w = await dbGet('weeks', newWs);
  if (!w) {
    w = { ws: newWs, entries: {}, paid: {}, closed: false };
    await dbPut('weeks', w);
  }
  S.week = w;
  S.date = newWs;
  render();
}

// ══════════════════════════════════════════════════════════════════════════
//  WHATSAPP SHARING
// ══════════════════════════════════════════════════════════════════════════
function shareCustomerWhatsApp(cId) {
  const cust = S.customers.find(c => c.id === cId);
  if (!cust) return;
  const w = S.week;
  const days = getCycleDays(w.ws);
  const res = calcCustomerWeek(cust, w);

  // Daily entries breakdown for WhatsApp
  let daysText = '';
  days.forEach((d, idx) => {
    const e = (w.entries[cust.id] || {})[d] || {};
    const cow = e.cow || 0;
    const buf = cust.buffOn ? (e.buf || 0) : 0;
    const tot = cow + buf;
    if (tot > 0) {
      daysText += `• ${DAY_NAMES[idx]}: ${formatKgArabic(tot)}\n`;
    }
  });

  const msg = 
`السلام عليكم يا ${cust.name} 🥛
كشف حساب توريد اللبن من *متجر أبو يوسف للألبان*
📅 الأسبوع: ${getCycleLabel(w.ws)}
-----------------------------
تفاصيل توريدك بالأيام:
${daysText || '• لم تسجل كميات\n'}-----------------------------
🐄 إجمالي لبن بقر: ${res.cowKg.toFixed(2)} كجم (${cust.cow || 0} ج) = ${res.cowAmt.toFixed(2)} ج.م
${cust.buffOn && res.bufKg > 0 ? `🐃 إجمالي لبن جاموس: ${res.bufKg.toFixed(2)} كجم (${cust.buff || 0} ج) = ${res.bufAmt.toFixed(2)} ج.م\n` : ''}-----------------------------
💰 *إجمالي المبلغ المستحق لك يوم الأربعاء: ${res.total.toFixed(2)} ج.م*
شكراً لتعاملكم الطيب معنا! 🙏`;

  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function shareGeneralWhatsApp() {
  const w = S.week;
  let totMoney = 0;
  let totKg = 0;
  S.customers.forEach(c => {
    const r = calcCustomerWeek(c, w);
    totMoney += r.total;
    totKg += r.totalKg;
  });

  const msg = 
`📊 *كشف حساب أسبوع: متجر أبو يوسف للألبان*
📅 ${getCycleLabel(w.ws)}
-----------------------------
👥 عدد الزباين: ${S.customers.length}
🥛 إجمالي كمية اللبن: ${totKg.toFixed(2)} كجم
💰 إجمالي فلوس الأسبوع لتسليم الأربعاء: ${totMoney.toLocaleString('ar-EG')} ج.م
-----------------------------
تاريخ التقرير: ${getDayNameAr(getTodayStr())} ${formatDateAr(getTodayStr())}`;

  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function exportWeekCSV() {
  const w = S.week;
  const days = getCycleDays(w.ws);
  const rows = [];

  rows.push(['الزبون', ...days.map(d => `${getDayNameAr(d)} (${formatDateAr(d)})`), 'إجمالي الكيلو', 'المبلغ ج.م'].join(','));

  S.customers.forEach(c => {
    const res = calcCustomerWeek(c, w);
    const dayCols = days.map(d => {
      const e = (w.entries[c.id] || {})[d] || {};
      return (e.cow || 0) + (e.buf || 0);
    });
    rows.push([`"${c.name}"`, ...dayCols, res.totalKg.toFixed(2), res.total.toFixed(2)].join(','));
  });

  const csv = '\uFEFF' + rows.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = `حساب-أسبوع-${w.ws}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('✅ تم تنزيل ملف Excel بنجاح', 'ok');
}

// ══════════════════════════════════════════════════════════════════════════
//  BACKUP & RESTORE
// ══════════════════════════════════════════════════════════════════════════
async function downloadBackup() {
  const data = {
    version: '4.0',
    cycle: 'ThursdayToWednesday',
    customers: S.customers,
    week: S.week,
    history: S.history
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `نسخة-أبو-يوسف-${getTodayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('💾 تم تنزيل النسخة الاحتياطية', 'ok');
}

function triggerRestoreInput() {
  const f = document.getElementById('restoreFile');
  if (f) f.click();
}

function handleRestoreFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const d = JSON.parse(e.target.result);
      if (d.customers) {
        for (const c of d.customers) await dbPut('customers', c);
        S.customers = d.customers;
      }
      if (d.week) {
        await dbPut('weeks', d.week);
        S.week = d.week;
      }
      if (d.history) {
        for (const h of d.history) await dbPut('weeks', h);
      }
      await loadData();
      closeModal();
      showToast('✅ تم استرجاع البيانات بنجاح', 'ok');
      render();
    } catch (err) {
      showToast('❌ ملف غير صالح', 'err');
    }
  };
  reader.readAsText(file);
}

// ══════════════════════════════════════════════════════════════════════════
//  HELPERS & INIT
// ══════════════════════════════════════════════════════════════════════════
function goView(v) {
  S.view = v;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let _tTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = `toast-msg show ${type}`;
  clearTimeout(_tTimer);
  _tTimer = setTimeout(() => { el.classList.remove('show'); }, 3000);
}

// PWA Offline Service Worker
if ('serviceWorker' in navigator) {
  const swCode = `
    const C='aby-dairy-v4';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      if(e.request.method!=='GET') return;
      e.respondWith(caches.open(C).then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok)c.put(e.request,res.clone());return res;}).catch(()=>r))));
    });
  `;
  try {
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'text/javascript' }))).catch(()=>{});
  } catch(e){}
}

async function start() {
  await initDB();
  await loadData();
  render();
}

start();
</script>
