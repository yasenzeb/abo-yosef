<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1e38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أبو يوسف للألبان">
<meta name="mobile-web-app-capable" content="yes">
<title>أبو يوسف للألبان - إدارة الإنتاج والحسابات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0b1e38;
  --navy-light: #162f55;
  --blue: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-soft: #eff6ff;
  --sky: #0284c7;
  --green: #059669;
  --green-hover: #047857;
  --green-soft: #ecfdf5;
  --amber: #d97706;
  --amber-soft: #fffbeb;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --bg: #f1f5f9;
  --surface: #ffffff;
  --border: #e2e8f0;
  --border-focus: #3b82f6;
  --ink: #0f172a;
  --ink-secondary: #475569;
  --muted: #64748b;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-full: 9999px;
  --shadow-sm: 0 1px 3px rgba(11,30,56,.06);
  --shadow-md: 0 4px 14px rgba(11,30,56,.08);
  --shadow-lg: 0 10px 25px rgba(11,30,56,.12);
  --font: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  min-height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  direction: rtl;
  text-align: right;
  -webkit-font-smoothing: antialiased;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  max-width: 600px;
  margin: 0 auto;
  background: var(--bg);
  box-shadow: 0 0 40px rgba(0,0,0,.04);
}

/* ─── APP HEADER ─── */
.app-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  color: #fff;
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: var(--shadow-md);
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,.12);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  backdrop-filter: blur(8px);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.2);
}
.brand-title {
  font-size: 17px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -.2px;
}
.brand-subtitle {
  font-size: 11px;
  color: rgba(255,255,255,.75);
  font-weight: 500;
  margin-top: 1px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.header-btn {
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.16);
  color: #fff;
  padding: 6px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all .15s;
}
.header-btn:active {
  background: rgba(255,255,255,.25);
  transform: scale(.97);
}

/* ─── CYCLE BANNER (الأسبوع من الأربع للاربع) ─── */
.cycle-strip {
  background: rgba(255,255,255,.07);
  border-radius: 8px;
  padding: 6px 10px;
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: #e2e8f0;
}
.cycle-badge {
  background: rgba(5, 150, 105, 0.35);
  border: 1px solid rgba(5, 150, 105, 0.6);
  color: #6ee7b7;
  padding: 2px 7px;
  border-radius: 6px;
  font-weight: 700;
  font-size: 10px;
}

/* ─── MAIN CONTENT CONTAINER ─── */
.main-view {
  flex: 1;
  padding: 14px 14px calc(78px + var(--safe-bottom)) 14px;
  overflow-y: auto;
}

/* ─── BOTTOM NAVIGATION ─── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 600px;
  margin: 0 auto;
  background: rgba(255,255,255,.98);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 50;
  padding-bottom: var(--safe-bottom);
  box-shadow: 0 -4px 16px rgba(11,30,56,.06);
}
.nav-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px 6px;
  border: none;
  background: none;
  color: var(--muted);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  gap: 3px;
  transition: all .2s;
  position: relative;
}
.nav-tab .tab-icon {
  font-size: 20px;
  line-height: 1;
  transition: transform .2s;
}
.nav-tab.active {
  color: var(--blue);
  font-weight: 800;
}
.nav-tab.active .tab-icon {
  transform: translateY(-2px) scale(1.1);
}
.nav-tab.active::after {
  content: '';
  position: absolute;
  top: 0;
  width: 24px;
  height: 3px;
  background: var(--blue);
  border-radius: 0 0 3px 3px;
}

/* ─── CARDS ─── */
.card {
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #f1f5f9;
}
.card-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
  display: flex;
  align-items: center;
  gap: 7px;
}

/* ─── STATS GRID ─── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 12px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 12px 14px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 3px;
  background: var(--blue);
}
.stat-card.green::before { background: var(--green); }
.stat-card.amber::before { background: var(--amber); }
.stat-value {
  font-size: 22px;
  font-weight: 900;
  color: var(--navy);
  line-height: 1.2;
}
.stat-card.green .stat-value { color: var(--green); }
.stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 3px;
}

/* ─── WEDNESDAY PAYOUT ALERT BOX ─── */
.payout-alert {
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
  border: 2px solid #86efac;
  border-radius: var(--r-md);
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.payout-alert-title {
  font-size: 14px;
  font-weight: 800;
  color: #166534;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.payout-alert-desc {
  font-size: 12px;
  color: #15803d;
  line-height: 1.5;
  margin-bottom: 10px;
}

/* ─── BUTTONS ─── */
.btn {
  padding: 11px 16px;
  border-radius: var(--r-sm);
  border: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
  transition: all .15s;
}
.btn:active {
  transform: scale(.98);
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:active { background: var(--blue-hover); }
.btn-success { background: var(--green); color: #fff; }
.btn-success:active { background: var(--green-hover); }
.btn-amber { background: var(--amber); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--navy); }
.btn-outline:active { background: #f8fafc; border-color: var(--blue); }
.btn-ghost { background: transparent; color: var(--blue); }
.btn-sm { padding: 6px 12px; font-size: 12px; width: auto; border-radius: 8px; }

/* ─── SEARCH & FILTER BAR ─── */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.search-input-wrap {
  position: relative;
  flex: 1;
}
.search-input {
  width: 100%;
  padding: 9px 34px 9px 12px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  transition: border-color .15s;
}
.search-input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.search-icon {
  position: absolute;
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 14px;
  pointer-events: none;
}

/* ─── DATE SELECTOR CHIPS (دورة الأسبوع) ─── */
.date-selector {
  display: flex;
  overflow-x: auto;
  gap: 6px;
  padding: 4px 2px 10px 2px;
  margin-bottom: 10px;
  scrollbar-width: none;
}
.date-selector::-webkit-scrollbar { display: none; }
.date-chip {
  flex-shrink: 0;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  min-width: 58px;
  color: var(--ink-secondary);
  transition: all .15s;
  position: relative;
}
.date-chip .chip-day { font-size: 11px; opacity: .8; }
.date-chip .chip-num { font-size: 14px; font-weight: 800; margin-top: 1px; }
.date-chip.active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
  box-shadow: 0 4px 10px rgba(11,30,56,.2);
}
.date-chip.is-wednesday::after {
  content: 'قبض';
  position: absolute;
  top: -4px;
  left: -2px;
  background: var(--green);
  color: #fff;
  font-size: 8px;
  padding: 1px 4px;
  border-radius: 4px;
  font-weight: 800;
}

/* ─── DAILY CUSTOMER CARD ─── */
.customer-daily-card {
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 13px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid var(--border);
  transition: border-color .15s;
}
.customer-daily-card:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.07);
}
.card-top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.customer-name {
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
}
.customer-daily-total {
  font-size: 13px;
  font-weight: 800;
  color: var(--green);
  background: var(--green-soft);
  padding: 3px 8px;
  border-radius: 6px;
  min-height: 22px;
}

.milk-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.milk-badge {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-secondary);
  background: #f8fafc;
  padding: 6px 8px;
  border-radius: 8px;
  min-width: 68px;
  border: 1px solid var(--border);
  text-align: center;
}
.milk-input {
  flex: 1;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 16px;
  font-weight: 800;
  font-family: inherit;
  text-align: center;
  color: var(--navy);
  background: #fff;
  transition: all .15s;
}
.milk-input:focus {
  outline: none;
  border-color: var(--blue);
  background: var(--blue-soft);
}
.milk-price-hint {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  font-weight: 600;
}

/* ─── FRACTION BUTTONS IN ARABIC (الكسور بالعربي) ─── */
.arabic-fractions-bar {
  display: flex;
  gap: 5px;
  margin-top: 4px;
  margin-bottom: 8px;
  margin-right: 76px;
  flex-wrap: wrap;
}
.arabic-frac-btn {
  padding: 5px 10px;
  border-radius: 8px;
  border: 1.5px solid #bfdbfe;
  background: #f0f7ff;
  color: var(--blue);
  font-size: 11px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  transition: all .12s;
  user-select: none;
}
.arabic-frac-btn:active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
  transform: scale(.95);
}
.arabic-frac-clear {
  border-color: #fecaca;
  background: #fff1f2;
  color: var(--red);
}
.arabic-frac-clear:active {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}

/* ─── CUSTOMER LIST VIEW ─── */
.customer-item-card {
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 12px 14px;
  margin-bottom: 8px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: transform .12s, box-shadow .12s;
}
.customer-item-card:active {
  transform: scale(.99);
  background: #f8fafc;
}
.customer-item-name {
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
}
.customer-item-prices {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 600;
}
.customer-item-actions {
  display: flex;
  gap: 5px;
}
.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--ink-secondary);
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .12s;
}
.icon-btn:active {
  background: #f1f5f9;
  transform: scale(.92);
}
.icon-btn.edit { color: var(--blue); border-color: #bfdbfe; background: var(--blue-soft); }
.icon-btn.delete { color: var(--red); border-color: #fecaca; background: var(--red-soft); }
.icon-btn.whatsapp { color: #059669; border-color: #a7f3d0; background: var(--green-soft); }

/* ─── MODALS & OVERLAYS ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(11,30,56,.55);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-sheet {
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 20px 18px calc(24px + var(--safe-bottom));
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 -10px 40px rgba(0,0,0,.15);
  animation: slideUp .22s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.modal-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--navy);
  display: flex;
  align-items: center;
  gap: 7px;
}
.close-btn {
  background: #f1f5f9;
  border: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
}

/* ─── BULK ADD MODAL / TABS ─── */
.tabs-header {
  display: flex;
  background: #f1f5f9;
  padding: 3px;
  border-radius: 10px;
  margin-bottom: 14px;
}
.tab-btn {
  flex: 1;
  padding: 7px 10px;
  border-radius: 8px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
}
.tab-btn.active {
  background: #fff;
  color: var(--navy);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.bulk-textarea {
  width: 100%;
  height: 140px;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: inherit;
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink);
  direction: rtl;
  resize: vertical;
}
.bulk-textarea:focus {
  outline: none;
  border-color: var(--blue);
}
.bulk-row-item {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

/* ─── FORM CONTROLS ─── */
.form-group {
  margin-bottom: 12px;
}
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-secondary);
  margin-bottom: 5px;
}
.form-input {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  background: #fff;
  direction: rtl;
  transition: border-color .15s;
}
.form-input:focus {
  outline: none;
  border-color: var(--blue);
}
.form-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  cursor: pointer;
}
.switch {
  width: 46px;
  height: 26px;
  background: var(--border);
  border-radius: 13px;
  position: relative;
  cursor: pointer;
  border: none;
  flex-shrink: 0;
  transition: background .2s;
}
.switch.on {
  background: var(--green);
}
.switch::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  background: #fff;
  border-radius: 50%;
  top: 3px;
  right: 3px;
  transition: transform .2s;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.switch.on::after {
  transform: translateX(-20px);
}

/* ─── TOAST NOTIFICATION ─── */
.toast-box {
  position: fixed;
  bottom: calc(76px + var(--safe-bottom));
  left: 16px;
  right: 16px;
  max-width: 500px;
  margin: 0 auto;
  background: var(--navy);
  color: #fff;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  z-index: 200;
  box-shadow: var(--shadow-lg);
  transform: translateY(20px);
  opacity: 0;
  transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}
.toast-box.show {
  transform: translateY(0);
  opacity: 1;
}
.toast-box.ok { background: var(--green); }
.toast-box.err { background: var(--red); }
.toast-box.warn { background: var(--amber); }

/* ─── TABLE VIEW FOR WEEKLY SCHEDULE ─── */
.table-wrap {
  overflow-x: auto;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 12px;
}
.app-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.app-table th {
  background: var(--navy);
  color: #fff;
  padding: 9px 6px;
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  white-space: nowrap;
}
.app-table td {
  padding: 8px 6px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

<script>
// ══════════════════════════════════════════════════════════════════════════
//  APP STATE & INITIALIZATION
// ══════════════════════════════════════════════════════════════════════════
let S = {
  view: 'home', // 'home' | 'daily' | 'customers' | 'reports' | 'history' | 'settings' | 'cDetail' | 'wDetail'
  customers: [],
  week: null,
  history: [],

  searchQuery: '',
  filterStatus: 'all', // 'all' | 'recorded' | 'unrecorded'
  editId: null,
  modal: null, // 'add' | 'edit' | 'bulkAdd' | 'bulkPrice' | 'share' | 'backup'
  bulkMode: 'names', // 'names' | 'rows'
  bulkNamesText: '',
  bulkDefaultCow: 15,
  bulkDefaultBufOn: false,
  bulkDefaultBuf: 25,
  bulkRows: [],
  confirm: null,
  cDetailId: null,
  wDetail: null,
  activeShareData: null
};

// ══════════════════════════════════════════════════════════════════════════
//  DATE & WEDNESDAY-TO-WEDNESDAY CYCLE MATH
// ══════════════════════════════════════════════════════════════════════════
const AR_DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

function getTodayStr() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

// Find the Wednesday start of the week for any given date
// In JS: Sunday=0, Monday=1, Tuesday=2, Wednesday=3, Thursday=4, Friday=5, Saturday=6
function getWeekStartWednesday(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  // diff to previous Wednesday (day 3):
  const diff = (day - 3 + 7) % 7;
  const wed = new Date(d);
  wed.setDate(d.getDate() - diff);
  return wed.toISOString().split('T')[0];
}

// 7 days of the cycle starting Wednesday:
// الأربعاء، الخميس، الجمعة، السبت، الأحد، الاثنين، الثلاثاء
function getWeekDays(ws) {
  const days = [];
  const start = new Date(ws + 'T00:00:00');
  for (let i = 0; i < 7; i++) {
    const cur = new Date(start);
    cur.setDate(start.getDate() + i);
    days.push(cur.toISOString().split('T')[0]);
  }
  return days;
}

// Next Wednesday (Payout & Settlement Day)
function getNextWednesday(ws) {
  const start = new Date(ws + 'T00:00:00');
  start.setDate(start.getDate() + 7);
  return start.toISOString().split('T')[0];
}

function formatDateAr(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getDate()} ${AR_MONTHS[d.getMonth()]}`;
}

function formatDateFullAr(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${AR_DAYS[d.getDay()]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]}`;
}

function getDayNameAr(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return AR_DAYS[d.getDay()];
}

function getWeekLabel(ws) {
  const days = getWeekDays(ws);
  const nextWed = getNextWednesday(ws);
  return `${formatDateAr(days[0])} — ${formatDateAr(nextWed)} (القبض)`;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// ══════════════════════════════════════════════════════════════════════════
//  ARABIC FRACTIONS FORMATTING & INPUT
// ══════════════════════════════════════════════════════════════════════════
// Convert numbers like 5.5 to "5 ونصف" or 0.25 to "ربع"
function formatKgArabic(val) {
  if (val === null || val === undefined || isNaN(val) || val <= 0) return '0 كجم';
  const num = parseFloat(val);
  const intPart = Math.floor(num);
  const frac = parseFloat((num - intPart).toFixed(4));

  let fracWord = '';
  if (Math.abs(frac - 0.25) < 0.02) fracWord = 'وربع';
  else if (Math.abs(frac - 0.5) < 0.02) fracWord = 'ونصف';
  else if (Math.abs(frac - 0.75) < 0.02) fracWord = 'وتلات أرباع';
  else if (Math.abs(frac - 0.33) < 0.03) fracWord = 'وثلث';
  else if (frac > 0) fracWord = `و${frac.toFixed(2)}`;

  if (intPart === 0) {
    if (Math.abs(frac - 0.25) < 0.02) return 'ربع كجم';
    if (Math.abs(frac - 0.5) < 0.02) return 'نصف كجم';
    if (Math.abs(frac - 0.75) < 0.02) return 'تلات أرباع كجم';
    if (Math.abs(frac - 0.33) < 0.03) return 'ثلث كجم';
    return `${num.toFixed(2)} كجم`;
  }

  if (!fracWord) return `${intPart} كجم`;
  return `${intPart} ${fracWord} كجم`;
}

// Quick apply fraction button in Arabic
function applyArabicFrac(inputId, cId, fracVal) {
  const input = document.getElementById(inputId);
  if (!input) return;
  const curStr = input.value.trim();
  const curNum = parseFloat(curStr) || 0;
  const intPart = Math.floor(curNum + 0.001);

  if (fracVal === 0) {
    // Clear
    input.value = '';
  } else if (fracVal === 1) {
    // Add 1 kg
    input.value = curNum > 0 ? (curNum + 1).toFixed(2).replace(/\.00$/, '') : '1';
  } else {
    // Set or replace fractional part cleanly
    const newVal = parseFloat((intPart + fracVal).toFixed(4));
    input.value = newVal;
  }
  handleMilkInput(cId);
}

// ══════════════════════════════════════════════════════════════════════════
//  INDEXED DB & PERSISTENCE
// ══════════════════════════════════════════════════════════════════════════
let _db;
function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('AbyDairyV3', 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      if (!db.objectStoreNames.contains('customers')) db.createObjectStore('customers', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('weeks')) db.createObjectStore('weeks', { keyPath: 'ws' });
    };
    req.onsuccess = (e) => {
      _db = e.target.result;
      resolve();
    };
    req.onerror = reject;
  });
}

function getStore(name, mode) {
  return _db.transaction(name, mode).objectStore(name);
}
function dbGet(store, key) {
  return new Promise((res, rej) => {
    const q = getStore(store, 'readonly').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = rej;
  });
}
function dbPut(store, val, key) {
  return new Promise((res, rej) => {
    const q = key !== undefined ? getStore(store, 'readwrite').put(val, key) : getStore(store, 'readwrite').put(val);
    q.onsuccess = () => res();
    q.onerror = rej;
  });
}
function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const q = getStore(store, 'readwrite').delete(key);
    q.onsuccess = () => res();
    q.onerror = rej;
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) => {
    const q = getStore(store, 'readonly').getAll();
    q.onsuccess = () => res(q.result || []);
    q.onerror = rej;
  });
}

// ══════════════════════════════════════════════════════════════════════════
//  DATA OPERATIONS & CALCULATION
// ══════════════════════════════════════════════════════════════════════════
function calcCustomerWeek(cust, week) {
  const days = getWeekDays(week.ws);
  const entries = week.entries || {};
  let cowKg = 0;
  let bufKg = 0;
  for (const d of days) {
    const e = (entries[cust.id] || {})[d] || {};
    if (e.cow && e.cow > 0) cowKg += e.cow;
    if (cust.buffOn && e.buf && e.buf > 0) bufKg += e.buf;
  }
  const cowRate = cust.cow || 0;
  const bufRate = cust.buff || 0;
  const cowAmt = cowKg * cowRate;
  const bufAmt = bufKg * bufRate;
  const total = cowAmt + bufAmt;
  return {
    cowKg,
    bufKg,
    totalKg: cowKg + bufKg,
    cowAmt,
    bufAmt,
    total
  };
}

async function loadData() {
  S.customers = await dbGetAll('customers');
  // Fallback to customers.json or local demo if empty
  if (!S.customers || S.customers.length === 0) {
    try {
      const res = await fetch('customers.json');
      if (res.ok) {
        const json = await res.json();
        if (json.customers && json.customers.length > 0) {
          S.customers = json.customers;
          for (const c of S.customers) await dbPut('customers', c);
        }
      }
    } catch (e) {}
  }
  S.customers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));

  const ws = getWeekStartWednesday(getTodayStr());
  let curWeek = await dbGet('weeks', ws);
  if (!curWeek) {
    // check if previous week file exists or create clean
    curWeek = { ws, entries: {}, paid: {}, closed: false };
    await dbPut('weeks', curWeek);
  }
  if (!curWeek.paid) curWeek.paid = {};
  S.week = curWeek;

  S.history = await dbGetAll('weeks');
  S.history.sort((a, b) => b.ws.localeCompare(a.ws));
}

async function saveCustomers() {
  for (const c of S.customers) {
    await dbPut('customers', c);
  }
}

async function saveCurrentWeek() {
  if (S.week) {
    await dbPut('weeks', S.week);
  }
}

// ══════════════════════════════════════════════════════════════════════════
//  HOME VIEW (OVERVIEW & QUICK ACTIONS)
// ══════════════════════════════════════════════════════════════════════════
function renderHomeView(container) {
  const w = S.week;
  const days = getWeekDays(w.ws);

  const isWednesdayToday = new Date().getDay() === 3;

  let totalWeekMoney = 0;
  let totalCowKg = 0;
  let totalBufKg = 0;
  let recordedTodayCount = 0;

  S.customers.forEach(c => {
    const res = calcCustomerWeek(c, w);
    totalWeekMoney += res.total;
    totalCowKg += res.cowKg;
    totalBufKg += res.bufKg;
    const e = (w.entries[c.id] || {})[today] || {};
    if ((e.cow && e.cow > 0) || (e.buf && e.buf > 0)) {
      recordedTodayCount++;
    }
  });

  const nextWed = getNextWednesday(w.ws);

  container.innerHTML = `

    ${isWednesdayToday ? `
      <div class="payout-alert">
        <div class="payout-alert-title">
          <span>🔔</span> اليوم هو الأربعاء — موعد تسليم الفلوس للعملاء!
        </div>
        <div class="payout-alert-desc">
          العملاء جاهزون لاستلام مستحقاتهم عن الأسبوع. يمكنك مراجعة كشف الحساب وتحديد من استلم وتصفية الأسبوع.
        </div>
        <button class="btn btn-success btn-sm" onclick="goView('reports')">💵 فتح كشف حساب وصرف الأربعاء</button>
      </div>
    ` : ''}

    <!-- STATS CARDS -->

        <div class="stat-value">${S.customers.length}</div>
        <div class="stat-label">إجمالي العملاء</div>
      </div>
      <div class="stat-card">

        <div class="stat-label">سُجِّلوا اليوم (${getDayNameAr(today)})</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${(totalCowKg + totalBufKg).toFixed(1)} <small style="font-size:12px">كجم</small></div>
        <div class="stat-label">لبن الأسبوع (بقر: ${totalCowKg.toFixed(1)} | جاموس: ${totalBufKg.toFixed(1)})</div>
      </div>
      <div class="stat-card green">
        <div class="stat-value">${totalWeekMoney.toLocaleString('ar-EG')} <small style="font-size:12px">ج.م</small></div>
        <div class="stat-label">مستحقات الأسبوع للتسليم</div>

      </button>
    </div>

    <!-- WEEKLY SUMMARY TABLE -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>📅</span> كشف جدول الأسبوع الحالي
        </div>
        <button class="btn btn-sm btn-outline" onclick="goView('reports')">عرض المبالغ 💰</button>
      </div>

      ${S.customers.length === 0 ? `

// ══════════════════════════════════════════════════════════════════════════
//  DAILY MILK ENTRY VIEW (تسجيل اللبن اليومي)
// ══════════════════════════════════════════════════════════════════════════
function renderDailyView(container) {
  const w = S.week;
  const days = getWeekDays(w.ws);
  const curDate = S.date;

  // Filter customers based on search
  const query = S.searchQuery.trim().toLowerCase();
  let list = S.customers.filter(c => !query || c.name.toLowerCase().includes(query));

  // Filter tab
  if (S.filterStatus === 'recorded') {
    list = list.filter(c => {
      const e = (w.entries[c.id] || {})[curDate] || {};
      return (e.cow && e.cow > 0) || (e.buf && e.buf > 0);
    });
  } else if (S.filterStatus === 'unrecorded') {
    list = list.filter(c => {
      const e = (w.entries[c.id] || {})[curDate] || {};
      return !(e.cow && e.cow > 0) && !(e.buf && e.buf > 0);
    });
  }

  container.innerHTML = `
    <!-- DATE CHIPS SCROLLER -->
    <div class="date-selector">
      ${days.map(d => {
        const isSel = d === curDate;
        const isWed = new Date(d + 'T00:00:00').getDay() === 3;
        const dObj = new Date(d + 'T00:00:00');
        return `

// Single Daily Entry Card
function renderCustomerDailyCardHTML(cust, curDate, week) {
  const entry = (week.entries[cust.id] || {})[curDate] || {};
  // CRITICAL REQUIREMENT:
  // "تخلي قائمه ادخال معدل اللبن الي تم تحصيله تكون فارغ ميكونش فيها صفر محطوط من الاول"
  // If entry.cow is empty or 0, value MUST be empty string ""!
  const cowVal = (entry.cow !== undefined && entry.cow !== null && entry.cow > 0) ? entry.cow : '';
  const bufVal = (entry.buf !== undefined && entry.buf !== null && entry.buf > 0) ? entry.buf : '';

  const cowKg = parseFloat(cowVal) || 0;
  const bufKg = cust.buffOn ? (parseFloat(bufVal) || 0) : 0;
  const totalMoney = (cowKg * (cust.cow || 0)) + (bufKg * (cust.buff || 0));

  return `
    <div class="customer-daily-card" id="card-${cust.id}">
      <div class="card-top-row">
        <div class="customer-name">${cust.name}</div>
        <div class="customer-daily-total" id="tot-${cust.id}">
          ${totalMoney > 0 ? `${totalMoney.toFixed(2)} ج.م` : ''}
        </div>
      </div>

      <!-- COW MILK INPUT -->
      <div class="milk-input-row">
        <span class="milk-badge">🐄 بقر</span>
        <input 
          class="milk-input" 
          type="number" 
          step="0.01" 
          min="0"
          placeholder="أدخل الكمية"
          id="cow-${cust.id}" 
          value="${cowVal}" 
          oninput="handleMilkInput('${cust.id}')"
        >
        <span class="milk-price-hint">${cust.cow} ج/كجم</span>
      </div>

      <!-- ARABIC FRACTIONS BUTTONS FOR COW -->
      <div class="arabic-fractions-bar">
        <button type="button" class="arabic-frac-btn" onclick="applyArabicFrac('cow-${cust.id}','${cust.id}',0.25)">+ ربع</button>
        <button type="button" class="arabic-frac-btn" onclick="applyArabicFrac('cow-${cust.id}','${cust.id}',0.5)">+ نص</button>
        <button type="button" class="arabic-frac-btn" onclick="applyArabicFrac('cow-${cust.id}','${cust.id}',0.75)">+ تلات أرباع</button>
        <button type="button" class="arabic-frac-btn" onclick="applyArabicFrac('cow-${cust.id}','${cust.id}',1)">+ كيلو</button>
        <button type="button" class="arabic-frac-btn arabic-frac-clear" onclick="applyArabicFrac('cow-${cust.id}','${cust.id}',0)">مسح ✕</button>
      </div>

      <!-- BUFFALO MILK INPUT (IF ENABLED) -->
      ${cust.buffOn ? `
        <div class="milk-input-row" style="margin-top: 8px;">
          <span class="milk-badge">🐃 جاموس</span>
          <input 
            class="milk-input" 
            type="number" 
            step="0.01" 
            min="0"
            placeholder="أدخل الكمية"
            id="buf-${cust.id}" 
            value="${bufVal}" 
            oninput="handleMilkInput('${cust.id}')"
          >
          <span class="milk-price-hint">${cust.buff} ج/كجم</span>
        </div>
        <!-- ARABIC FRACTIONS BUTTONS FOR BUFFALO -->
        <div class="arabic-fractions-bar">
          <button type="button" class="arabic-frac-btn" onclick="applyArabicFrac('buf-${cust.id}','${cust.id}',0.25)">+ ربع</button>
          <button type="button" class="arabic-frac-btn" onclick="applyArabicFrac('buf-${cust.id}','${cust.id}',0.5)">+ نص</button>
          <button type="button" class="arabic-frac-btn" onclick="applyArabicFrac('buf-${cust.id}','${cust.id}',0.75)">+ تلات أرباع</button>

          <button type="button" class="arabic-frac-btn arabic-frac-clear" onclick="applyArabicFrac('buf-${cust.id}','${cust.id}',0)">مسح ✕</button>
        </div>
      ` : ''}
    </div>
  `;
}

function handleMilkInput(cId) {
  const cust = S.customers.find(c => c.id === cId);
  if (!cust) return;

  const cowInput = document.getElementById(`cow-${cId}`);
  const bufInput = document.getElementById(`buf-${cId}`);

  const cowVal = cowInput ? cowInput.value.trim() : '';
  const bufVal = bufInput ? bufInput.value.trim() : '';

  const cowNum = parseFloat(cowVal) || 0;
  const bufNum = parseFloat(bufVal) || 0;

  const total = (cowNum * (cust.cow || 0)) + (cust.buffOn ? (bufNum * (cust.buff || 0)) : 0);

  const totEl = document.getElementById(`tot-${cId}`);
  if (totEl) {
    totEl.textContent = total > 0 ? `${total.toFixed(2)} ج.م` : '';
  }

  // Live update in state
  if (!S.week.entries[cId]) S.week.entries[cId] = {};
  if (!S.week.entries[cId][S.date]) S.week.entries[cId][S.date] = {};

  if (cowNum > 0) {
    S.week.entries[cId][S.date].cow = cowNum;
  } else {
    delete S.week.entries[cId][S.date].cow;
  }

  if (cust.buffOn && bufNum > 0) {
    S.week.entries[cId][S.date].buf = bufNum;
  } else {
    delete S.week.entries[cId][S.date].buf;
  }

  // Debounced auto-save
  clearTimeout(S._autoSaveTimer);
  S._autoSaveTimer = setTimeout(() => {
    saveCurrentWeek();
  }, 1000);
}

async function saveDayEntries() {
  S.customers.forEach(cust => {
    const cowInput = document.getElementById(`cow-${cust.id}`);
    const bufInput = document.getElementById(`buf-${cust.id}`);
    if (cowInput || bufInput) {
      handleMilkInput(cust.id);
    }
  });
  await saveCurrentWeek();
  showToast(`✅ تم حفظ بيانات يوم ${formatDateAr(S.date)} بنجاح`, 'ok');
}

//  BULK CUSTOMERS LOGIC (الأسماء تحت بعض وكل عميل يتضاف لوحده)
// ══════════════════════════════════════════════════════════════════════════
function openBulkAddModal() {
  S.modal = 'bulkAdd';
  S.bulkMode = 'names';
  if (!S.bulkRows || !S.bulkRows.length) initBulkRows();
  render();
}

function setBulkMode(mode) {
  S.bulkMode = mode;
  render();
}

function toggleBulkDefBuff() {
  S.bulkDefaultBufOn = !S.bulkDefaultBufOn;
  const btn = document.getElementById('btnBulkDefBuff');
  if (btn) btn.className = `switch ${S.bulkDefaultBufOn ? 'on' : ''}`;
}

function initBulkRows() {
  S.bulkRows = [
    { name: '', cow: S.bulkDefaultCow || 15, buf: S.bulkDefaultBuf || 25 },
    { name: '', cow: S.bulkDefaultCow || 15, buf: S.bulkDefaultBuf || 25 },
    { name: '', cow: S.bulkDefaultCow || 15, buf: S.bulkDefaultBuf || 25 }
  ];
  return S.bulkRows;
}

function addBulkRow() {
  collectCurrentBulkRows();
  S.bulkRows.push({ name: '', cow: S.bulkDefaultCow || 15, buf: S.bulkDefaultBuf || 25 });
  render();
}

function removeBulkRow(idx) {
  collectCurrentBulkRows();
  S.bulkRows.splice(idx, 1);
  if (S.bulkRows.length === 0) S.bulkRows.push({ name: '', cow: 15, buf: 25 });
  render();
}

function collectCurrentBulkRows() {
  S.bulkRows.forEach((r, i) => {
    const nEl = document.getElementById(`br-name-${i}`);
    const cEl = document.getElementById(`br-cow-${i}`);
    const bEl = document.getElementById(`br-buf-${i}`);
    if (nEl) r.name = nEl.value;
    if (cEl) r.cow = parseFloat(cEl.value) || 0;
    if (bEl) r.buf = parseFloat(bEl.value) || 0;
  });
}

async function processBulkNamesAdd() {
  const txtEl = document.getElementById('bulkNamesInput');
  const cowEl = document.getElementById('bulkDefCow');
  const bufEl = document.getElementById('bulkDefBuf');

  const text = txtEl ? txtEl.value : '';
  const defCow = cowEl ? parseFloat(cowEl.value) || 15 : 15;
  const defBuf = bufEl ? parseFloat(bufEl.value) || 25 : 25;
  const buffOn = S.bulkDefaultBufOn;

  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length === 0) {
    showToast('⚠️ يرجى كتابة اسم عميل واحد على الأقل', 'warn');
    return;
  }

  let addedCount = 0;
  for (const name of lines) {
    // Avoid exact duplicate names
    const exists = S.customers.some(c => c.name.toLowerCase() === name.toLowerCase());
    const newCust = {
      id: uid(),
      name: name,
      cow: defCow,
      buffOn: buffOn,
      buff: buffOn ? defBuf : 0,
      addedAt: getTodayStr()
    };
    S.customers.push(newCust);
    addedCount++;
  }

  S.customers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  await saveCustomers();
  closeModal();
  showToast(`✅ تمت إضافة ${addedCount} عميل بنجاح وكل عميل مسجل بمفرده!`, 'ok');
}

async function processBulkRowsAdd() {
  collectCurrentBulkRows();
  const valid = S.bulkRows.filter(r => r.name.trim().length > 0);
  if (valid.length === 0) {
    showToast('⚠️ يرجى كتابة اسم عميل واحد على الأقل', 'warn');
    return;
  }

  valid.forEach(r => {
    S.customers.push({
      id: uid(),
      name: r.name.trim(),
      cow: r.cow > 0 ? r.cow : 15,
      buffOn: r.buf > 0,
      buff: r.buf > 0 ? r.buf : 0,
      addedAt: getTodayStr()
    });
  });

  S.customers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  await saveCustomers();
  closeModal();
  showToast(`✅ تمت إضافة ${valid.length} عميل بنجاح`, 'ok');
}

//  SINGLE CUSTOMER CRUD
// ══════════════════════════════════════════════════════════════════════════
function openEditModal(id) {
  S.editId = id;
  S.modal = 'edit';
  render();
}

function toggleFormBuff() {
  const grp = document.getElementById('grpCustBuf');
  const btn = document.getElementById('btnFormBuff');
  const isOn = btn.classList.contains('on');
  if (isOn) {
    btn.classList.remove('on');
    grp.style.display = 'none';
  } else {
    btn.classList.add('on');
    grp.style.display = 'block';
  }
}

async function saveCustomerForm() {
  const nameEl = document.getElementById('inpCustName');
  const cowEl = document.getElementById('inpCustCow');
  const bufEl = document.getElementById('inpCustBuf');
  const btnBuff = document.getElementById('btnFormBuff');

  const name = nameEl ? nameEl.value.trim() : '';
  const cow = cowEl ? parseFloat(cowEl.value) : 0;
  const buffOn = btnBuff ? btnBuff.classList.contains('on') : false;
  const buff = bufEl ? parseFloat(bufEl.value) : 0;

  if (!name) {
    showToast('❌ أدخل اسم العميل', 'err');
    return;
  }
  if (!cow || cow <= 0) {
    showToast('❌ أدخل سعر لبن البقر', 'err');
    return;
  }
  if (buffOn && (!buff || buff <= 0)) {
    showToast('❌ أدخل سعر لبن الجاموس', 'err');
    return;
  }

  if (S.modal === 'edit' && S.editId) {
    const idx = S.customers.findIndex(c => c.id === S.editId);
    if (idx !== -1) {
      S.customers[idx] = {
        ...S.customers[idx],
        name,
        cow,
        buffOn,
        buff: buffOn ? buff : 0
      };
      await saveCustomers();
      showToast('✅ تم تعديل بيانات العميل بنجاح', 'ok');
    }
  } else {
    const newCust = {
      id: uid(),
      name,
      cow,
      buffOn,
      buff: buffOn ? buff : 0,
      addedAt: getTodayStr()
    };
    S.customers.push(newCust);
    S.customers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    await saveCustomers();
    showToast('✅ تمت إضافة العميل الجديد بنجاح', 'ok');
  }

  closeModal();
}

function confirmDeleteCustomer(id) {
  const c = S.customers.find(x => x.id === id);
  if (!c) return;
  S.confirm = {
    title: 'حذف العميل',
    msg: `هل أنت متأكد من حذف العميل "${c.name}" نهائياً من النظام؟`,
    icon: '🗑️',
    btnClass: 'btn-danger',
    fn: `executeDeleteCustomer('${id}')`
  };
  render();
}

async function executeDeleteCustomer(id) {
  await dbDelete('customers', id);
  S.customers = S.customers.filter(c => c.id !== id);
  await saveCustomers();
  closeConfirm();
  showToast('🗑️ تم حذف العميل نهائياً', 'ok');
}

async function applyBulkPriceUpdate() {
  const cowEl = document.getElementById('newGlobalCowPrice');
  const bufEl = document.getElementById('newGlobalBufPrice');
  const newCow = cowEl ? parseFloat(cowEl.value) : 0;
  const newBuf = bufEl ? parseFloat(bufEl.value) : 0;

  if (!newCow && !newBuf) {
    showToast('⚠️ أدخل سعراً واحداً على الأقل للتحديث', 'warn');
    return;
  }

  S.customers.forEach(c => {
    if (newCow > 0) c.cow = newCow;
    if (newBuf > 0 && c.buffOn) c.buff = newBuf;
  });

  await saveCustomers();
  closeModal();
  showToast('✅ تم تحديث الأسعار لجميع العملاء بنجاح', 'ok');
}

function confirmCloseWeek() {
  const w = S.week;
  S.confirm = {
    title: '🔄 إغلاق أسبوع ' + getWeekLabel(w.ws),
    msg: 'سيتم أرشفة هذا الأسبوع كاملاً في السجل التاريخي، وتصفير كميات اللبن لبدء أسبوع جديد ابتداءً من يوم الأربعاء القادم. هل تم تسليم جميع العملاء فلوسهم؟',
    icon: '💰',
    btnClass: 'btn-success',
    fn: 'executeCloseWeek()'
  };
  render();
}

async function executeCloseWeek() {
  const curWeek = S.week;
  const archived = {
    ...curWeek,
    closed: true,
    closedAt: new Date().toISOString(),
    snapshot: JSON.parse(JSON.stringify(S.customers))
  };

  await dbPut('weeks', archived);

  // New week starts exactly next Wednesday!
  const nextWed = getNextWednesday(curWeek.ws);
  const newWeek = {
    ws: nextWed,
    entries: {},
    paid: {},
    closed: false
  };

  await dbPut('weeks', newWeek);
  S.week = newWeek;
  S.history = await dbGetAll('weeks');
  S.history.sort((a, b) => b.ws.localeCompare(a.ws));
  S.date = nextWed;

  closeConfirm();
  showToast('🎉 تم إغلاق الأسبوع بنجاح وبدء دورة أسبوع جديد!', 'ok');
  goView('home');
}

  let grand = 0;
  const rows = custs.map(c => {
    const res = calcCustomerWeek(c, w);
    grand += res.total;
    return { c, ...res };
  });

  container.innerHTML = `
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
      <h2 style="font-size: 15px; font-weight: 800; color: var(--navy);">📊 أرشيف أسبوع: ${getWeekLabel(w.ws)}</h2>
      <button class="btn btn-sm btn-outline" onclick="goView('history')">◀ رجوع</button>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-weight: 800;">إجمالي الفلوس المسلمة:</span>
        <span style="font-size: 18px; font-weight: 900; color: var(--green);">${grand.toLocaleString('ar-EG')} ج.م</span>
      </div>
      <div class="table-wrap">
        <table class="app-table">
          <thead>
            <tr>
              <th style="text-align: right; padding-right: 8px;">العميل</th>
              ${days.map(d => `<th>${formatDateAr(d).split(' ')[0]}<br>${getDayNameAr(d).slice(0,3)}</th>`).join('')}
              <th>كجم</th>
              <th>المبلغ</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td style="text-align: right; font-weight: 700; padding-right: 8px;">${r.c.name}</td>
                ${days.map(d => {
                  const e = (w.entries[r.c.id] || {})[d] || {};
                  const t = (e.cow || 0) + (e.buf || 0);
                  return `<td>${t > 0 ? t : 'ـ'}</td>`;
                }).join('')}
                <td>${r.totalKg.toFixed(1)}</td>
                <td style="color: var(--green); font-weight: 800;">${r.total.toFixed(0)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function exportWeekCSV() {
  const w = S.week;
  const days = getWeekDays(w.ws);
  const rows = [];

  // Header row
  const header = ['العميل', ...days.map(d => `${formatDateAr(d)} (${getDayNameAr(d)})`), 'إجمالي الكيلو', 'المبلغ ج.م'];
  rows.push(header.join(','));

  S.customers.forEach(c => {
    const res = calcCustomerWeek(c, w);
    const dayCols = days.map(d => {
      const e = (w.entries[c.id] || {})[d] || {};
      return (e.cow || 0) + (e.buf || 0);
    });
    const row = [
      `"${c.name}"`,
      ...dayCols,
      res.totalKg.toFixed(2),
      res.total.toFixed(2)
    ];
    rows.push(row.join(','));
  });

  const csvContent = '\uFEFF' + rows.join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `كشف-حساب-أسبوع-${w.ws}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('✅ تم تنزيل ملف Excel / CSV بنجاح', 'ok');
}

function triggerRestoreInput() {
  const inp = document.getElementById('restoreFileInput');
  if (inp) inp.click();
}

function handleRestoreFile(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.customers && Array.isArray(data.customers)) {
        for (const c of data.customers) await dbPut('customers', c);
        S.customers = data.customers;
      }
      if (data.week && data.week.ws) {
        await dbPut('weeks', data.week);
        S.week = data.week;
      }
      if (data.history && Array.isArray(data.history)) {
        for (const w of data.history) await dbPut('weeks', w);
      }
      await loadData();
      closeModal();
      showToast('✅ تم استرجاع جميع البيانات بنجاح', 'ok');
      render();
    } catch (err) {
      showToast('❌ ملف غير صالح أو تالف', 'err');
    }
  };
  reader.readAsText(file);
}

function goView(v) {
  S.view = v;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let _toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = `toast-box show ${type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => {
    el.classList.remove('show');
  }, 3200);
}

// Offline ServiceWorker
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE_NAME = 'aby-dairy-v3';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      e.respondWith(
        caches.open(CACHE_NAME).then(cache => 
          cache.match(e.request).then(res => res || fetch(e.request).then(netRes => {
            if (netRes.ok) cache.put(e.request, netRes.clone());
            return netRes;
          }).catch(() => res))
        )
      );
    });
  `;
  try {
    const swBlob = new Blob([swCode], { type: 'text/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  } catch (e) {}
}
