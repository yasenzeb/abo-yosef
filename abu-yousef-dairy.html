<style>
:root {
  --navy: #0b1e38;
  --navy-light: #162f55;
  --blue: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-soft: #eff6ff;
  --green: #059669;
  --green-hover: #047857;
  --green-soft: #ecfdf5;
  --amber: #d97706;
  --amber-soft: #fffbeb;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --ink: #0f172a;
  --ink-secondary: #475569;
  --muted: #64748b;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --shadow-sm: 0 1px 3px rgba(11,30,56,.06);
  --shadow-md: 0 4px 14px rgba(11,30,56,.08);
  --font: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  min-height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  direction: rtl;
  text-align: right;
  -webkit-font-smoothing: antialiased;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  max-width: 600px;
  margin: 0 auto;
  background: var(--bg);
  box-shadow: 0 0 40px rgba(0,0,0,.04);
}

/* ─── HEADER ─── */
.app-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  color: #fff;
  padding: 12px 14px;
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: var(--shadow-md);
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  width: 38px;
  height: 38px;
  background: rgba(255,255,255,.14);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.brand-title {
  font-size: 16px;
  font-weight: 800;
  line-height: 1.2;
}
.brand-subtitle {
  font-size: 11px;
  color: #cbd5e1;
  font-weight: 500;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 5px;
}
.header-btn {
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.2);
  color: #fff;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.header-btn.folder-connected {
  background: rgba(5, 150, 105, 0.4);
  border-color: #6ee7b7;
  color: #a7f3d0;
}
.header-btn.folder-reconnect {
  background: rgba(217, 119, 6, 0.4);
  border-color: #fcd34d;
  color: #fef08a;
  animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.75; }
}

/* ─── FOLDER STATUS BANNER ─── */
.folder-status-bar {
  background: rgba(255,255,255,.08);
  border-radius: 8px;
  padding: 6px 10px;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
}

/* ─── WEEK CYCLE BAR (الخميس إلى الأربعاء) ─── */
.week-cycle-bar {
  background: rgba(255,255,255,.08);
  border-radius: 10px;
  padding: 8px 10px;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: #e2e8f0;
}
.week-nav-btn {
  background: rgba(255,255,255,.16);
  border: none;
  color: #fff;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.week-nav-btn:active { background: rgba(255,255,255,.3); }

/* ─── MAIN CONTAINER ─── */
.main-view {
  flex: 1;
  padding: 12px 14px calc(76px + var(--safe-bottom)) 14px;
  overflow-y: auto;
}

/* ─── BOTTOM NAV ─── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 600px;
  margin: 0 auto;
  background: rgba(255,255,255,.98);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 50;
  padding-bottom: var(--safe-bottom);
  box-shadow: 0 -4px 16px rgba(11,30,56,.06);
}
.nav-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px 6px;
  border: none;
  background: none;
  color: var(--muted);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  gap: 3px;
  position: relative;
}
.nav-tab .tab-icon { font-size: 20px; line-height: 1; }
.nav-tab.active { color: var(--blue); font-weight: 800; }
.nav-tab.active::after {
  content: '';
  position: absolute;
  top: 0;
  width: 26px;
  height: 3px;
  background: var(--blue);
  border-radius: 0 0 3px 3px;
}

/* ─── CARDS ─── */
.card {
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 13px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid #f1f5f9;
}
.card-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ─── STATS GRID ─── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 12px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 12px 14px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 3px;
  background: var(--blue);
}
.stat-card.green::before { background: var(--green); }
.stat-value {
  font-size: 20px;
  font-weight: 900;
  color: var(--navy);
  line-height: 1.2;
}
.stat-card.green .stat-value { color: var(--green); }
.stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 3px;
}

/* ─── BUTTONS ─── */
.btn {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  transition: all .12s;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-success { background: var(--green); color: #fff; }
.btn-amber { background: var(--amber); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-outline { background: #fff; border: 1.5px solid var(--border); color: var(--navy); }
.btn-outline:active { background: #f8fafc; border-color: var(--blue); }
.btn-sm { padding: 5px 10px; font-size: 12px; width: auto; border-radius: 8px; }

/* ─── SEARCH INPUT ─── */
.search-wrap {
  position: relative;
  margin-bottom: 10px;
}
.search-input {
  width: 100%;
  padding: 9px 34px 9px 12px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
}
.search-input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.search-icon {
  position: absolute;
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 14px;
  pointer-events: none;
}

/* ─── 7 DAYS SELECTOR BAR (الخميس -> الأربعاء) ─── */
.days-bar {
  display: flex;
  overflow-x: auto;
  gap: 6px;
  padding: 4px 2px 10px 2px;
  margin-bottom: 8px;

}
.days-bar::-webkit-scrollbar { display: none; }
.day-chip {
  flex: 1;
  min-width: 62px;
  padding: 8px 6px;
  border-radius: 12px;
  background: #fff;
  border: 1.5px solid var(--border);
  font-family: inherit;
  cursor: pointer;
  text-align: center;
  color: var(--ink-secondary);
  position: relative;
  transition: all .15s;
}
.day-chip .chip-name { font-size: 11px; font-weight: 700; }
.day-chip .chip-date { font-size: 13px; font-weight: 800; margin-top: 1px; }
.day-chip.active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
  box-shadow: 0 3px 8px rgba(11,30,56,.2);
}
.day-chip.is-payout::before {
  content: 'القبض 💰';
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  background: #059669;
  color: #fff;
  font-size: 8px;
  font-weight: 900;
  padding: 1px 5px;
  border-radius: 4px;
  white-space: nowrap;
}

/* ─── DAILY ENTRY CARD ─── */
.daily-card {
  background: #fff;
  border-radius: var(--r-md);
  padding: 12px 14px;
  margin-bottom: 9px;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid var(--border);
}
.daily-card:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.07);
}
.daily-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.daily-card-name {
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
}
.daily-card-money {
  font-size: 12px;
  font-weight: 800;
  color: var(--green);
  background: var(--green-soft);
  padding: 2px 7px;
  border-radius: 6px;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.input-badge {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-secondary);
  background: #f1f5f9;
  padding: 6px 8px;
  border-radius: 8px;
  min-width: 66px;
  text-align: center;
}
.qty-input {
  flex: 1;
  padding: 8px 10px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 16px;
  font-weight: 800;
  font-family: inherit;
  text-align: center;
  color: var(--navy);
  background: #fff;
}
.qty-input:focus {
  outline: none;
  border-color: var(--blue);
  background: var(--blue-soft);
}
.price-note {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}

/* ─── FRACTIONS IN ARABIC ─── */
.frac-bar {
  display: flex;
  gap: 5px;
  margin-top: 3px;
  margin-bottom: 8px;
  margin-right: 74px;
  flex-wrap: wrap;
}
.frac-btn {
  padding: 4px 9px;
  border-radius: 7px;
  border: 1.5px solid #bfdbfe;
  background: #f0f7ff;
  color: var(--blue);
  font-size: 11px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
}
.frac-btn:active { background: var(--blue); color: #fff; }
.frac-btn.clear { border-color: #fecaca; background: #fff1f2; color: var(--red); }
.frac-btn.clear:active { background: var(--red); color: #fff; }

/* ─── HALF PRICE QUICK BUTTON ─── */
.half-btn {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1.5px solid #bfdbfe;
  background: #eff6ff;
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
}
.half-btn:active { background: var(--blue); color: #fff; }

/* ─── TABLE VIEW ─── */
.table-scroll {
  overflow-x: auto;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 12px;
}
.report-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.report-tbl th {
  background: var(--navy);
  color: #fff;
  padding: 8px 5px;
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  white-space: nowrap;
}
.report-tbl td {
  padding: 8px 5px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.report-tbl tr:nth-child(even) td { background: #f8fafc; }
.report-tbl .total-tr td {
  background: var(--green-soft) !important;
  font-weight: 900;
  color: var(--green);
}

/* ─── CUSTOMER LIST CARDS ─── */
.cust-card {
  background: #fff;
  border-radius: var(--r-md);
  padding: 12px 14px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
}
.cust-name {
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
}
.cust-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.cust-actions {
  display: flex;
  gap: 5px;
}
.action-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #fff;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.action-btn.wa { color: #059669; border-color: #a7f3d0; background: var(--green-soft); }
.action-btn.edit { color: var(--blue); border-color: #bfdbfe; background: var(--blue-soft); }
.action-btn.del { color: var(--red); border-color: #fecaca; background: var(--red-soft); }

/* ─── MODALS ─── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(11,30,56,.55);
  backdrop-filter: blur(3px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-box {
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(24px + var(--safe-bottom));
  width: 100%;
  max-width: 600px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 -10px 40px rgba(0,0,0,.15);
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);

.modal-title { font-size: 15px; font-weight: 800; color: var(--navy); }
.modal-close {
  background: #f1f5f9;
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;

  font-size: 15px;

/* ─── FORM CONTROLS ─── */
.form-grp { margin-bottom: 12px; }
.form-lbl {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-secondary);
  margin-bottom: 4px;
}
.form-ctl {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  background: #fff;
  direction: rtl;
}
.form-ctl:focus { outline: none; border-color: var(--blue); }

.bulk-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 8px;
}

/* ─── CALENDAR PICKER MODAL GRID ─── */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin: 10px 0;
  text-align: center;
}
.cal-head {
  font-size: 11px;
  font-weight: 800;
  color: var(--muted);
  padding: 4px 0;
}
.cal-day-cell {
  padding: 8px 4px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #fff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all .12s;
}
.cal-day-cell:active { transform: scale(.95); }
.cal-day-cell.today {
  border-color: var(--blue);
  color: var(--blue);
  font-weight: 900;
}
.cal-day-cell.selected {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}
.cal-day-cell.payout {
  background: #f0fdf4;
  color: #059669;
}

/* ─── TOAST ─── */
.toast-msg {
  position: fixed;
  bottom: calc(76px + var(--safe-bottom));
  left: 16px;
  right: 16px;
  max-width: 450px;
  margin: 0 auto;
  background: var(--navy);
  color: #fff;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  z-index: 200;
  transform: translateY(20px);
  opacity: 0;
  transition: all .25s;
  pointer-events: none;
}
.toast-msg.show { transform: translateY(0); opacity: 1; }
.toast-msg.ok { background: var(--green); }
.toast-msg.err { background: var(--red); }
.toast-msg.warn { background: var(--amber); }

@media print {
  body { background: #fff; }
  #app { max-width: 100%; box-shadow: none; }
  .bottom-nav, .app-header, .btn, .days-bar, .search-wrap, .frac-bar, .week-cycle-bar { display: none !important; }
  .main-view { padding: 0 !important; }
  .card { box-shadow: none !important; border: 1px solid #000 !important; }
}
</style>

<div id="app"></div>
<div id="toast" class="toast-msg"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════
//  ROBUST DATE & CALENDAR SYSTEM (ZERO TIMEZONE OFFSET SHIFTS)
// ══════════════════════════════════════════════════════════════════════════
const AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const AR_DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

function formatYMD(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseYMD(str) {
  if (!str) return new Date();
  const parts = String(str).split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
}

function getWeekStartThursday(dateStr) {
  const d = parseYMD(dateStr);
  const day = d.getDay();
  const diff = (day - 4 + 7) % 7;
  d.setDate(d.getDate() - diff);
  return formatYMD(d);
}

function getCycleDays(ws) {
  const verifiedWs = getWeekStartThursday(ws);
  const start = parseYMD(verifiedWs);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const cur = new Date(start);
    cur.setDate(start.getDate() + i);
    days.push(formatYMD(cur));
  }
  return days;
}

function formatDateAr(dateStr) {
  const d = parseYMD(dateStr);
  return `${d.getDate()} ${AR_MONTHS[d.getMonth()]}`;
}

function formatDateFullAr(dateStr) {

// ══════════════════════════════════════════════════════════════════════════
//  ARABIC FRACTIONS (الكسور بالعربي)
// ══════════════════════════════════════════════════════════════════════════
function formatKgArabic(val) {
  if (!val || isNaN(val) || val <= 0) return '0 كجم';
  const num = parseFloat(val);
  const intPart = Math.floor(num);
  const frac = parseFloat((num - intPart).toFixed(4));

  let fracWord = '';
  if (Math.abs(frac - 0.25) < 0.02) fracWord = 'وربع';
  else if (Math.abs(frac - 0.5) < 0.02) fracWord = 'ونصف';
  else if (Math.abs(frac - 0.75) < 0.02) fracWord = 'وتلات أرباع';
  else if (frac > 0) fracWord = `و${frac.toFixed(2)}`;

  if (intPart === 0) {
    if (Math.abs(frac - 0.25) < 0.02) return 'ربع كجم';
    if (Math.abs(frac - 0.5) < 0.02) return 'نصف كجم';
    if (Math.abs(frac - 0.75) < 0.02) return 'تلات أرباع كجم';
    return `${num.toFixed(2)} كجم`;
  }
  return fracWord ? `${intPart} ${fracWord} كجم` : `${intPart} كجم`;
}

function applyFraction(inputId, custId, fracVal) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  const curNum = parseFloat(inp.value.trim()) || 0;
  const intPart = Math.floor(curNum + 0.001);

  if (fracVal === 0) {
    inp.value = '';
  } else if (fracVal === 1) {
    inp.value = curNum > 0 ? (curNum + 1).toFixed(2).replace(/\.00$/, '') : '1';
  } else {
    inp.value = parseFloat((intPart + fracVal).toFixed(4));
  }
  handleMilkInput(custId);
}

// ══════════════════════════════════════════════════════════════════════════
//  INDEXED DB & REAL HARD DRIVE FOLDER SYNC (حفظ في الفولدر المحدد)
// ══════════════════════════════════════════════════════════════════════════
let _db;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('AbyDairyMainDB', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if (!d.objectStoreNames.contains('customers')) d.createObjectStore('customers', { keyPath: 'id' });
    };
    r.onsuccess = e => { _db = e.target.result; res(); };
    r.onerror = rej;
  });
}

function dbPutMeta(key, val) {
  return new Promise(res => {
    try {
      const tx = _db.transaction('meta', 'readwrite');
      tx.objectStore('meta').put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => res();
    } catch(e) { res(); }
  });
}

function dbGetMeta(key) {
  return new Promise(res => {
    try {
      const tx = _db.transaction('meta', 'readonly');
      const q = tx.objectStore('meta').get(key);
      q.onsuccess = () => res(q.result);
      q.onerror = () => res(null);
    } catch(e) { res(null); }
  });
}

async function initFolder() {
  try {
    const handle = await dbGetMeta('folderHandle');
    if (handle) {
      S.hasSavedHandle = true;
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        S.folderHandle = handle;
      }
    }
  } catch(e) {}
}

async function reconnectFolder() {
  try {
    const handle = await dbGetMeta('folderHandle');
    if (handle) {
      const perm = await handle.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        S.folderHandle = handle;
        showToast('📁 تم تأكيد الإذن للمجلد بنجاح! جاري المزامنة...', 'ok');
        await syncAllFilesToDisk();
        render();
        return;
      }
    }
  } catch(e) {}
  pickFolder();
}

async function pickFolder() {
  if (!('showDirectoryPicker' in window)) {
    showToast('⚠️ متصفحك لا يدعم ربط المجلد المباشر. يتم الحفظ التلقائي في ذاكرة الجهاز والتطبيق.', 'warn');
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    S.folderHandle = handle;
    S.hasSavedHandle = true;
    await dbPutMeta('folderHandle', handle);
    showToast('📁 تم ربط المجلد بنجاح! سيتم حفظ الملفات تلقائياً فيه.', 'ok');
    await syncAllFilesToDisk();
    render();
  } catch(e) {
    if (e.name !== 'AbortError') {
      showToast('❌ تعذر ربط المجلد: ' + e.message, 'err');
    }
  }
}

async function mandatoryPickFolder() {
  await pickFolder();

    render();

}

function skipMandatoryFolder() {

async function writeDiskFile(filename, content) {
  if (!S.folderHandle) return;
  try {
    const perm = await S.folderHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      const req = await S.folderHandle.requestPermission({ mode: 'readwrite' });
      if (req !== 'granted') return;
    }
    const fh = await S.folderHandle.getFileHandle(filename, { create: true });
    const wr = await fh.createWritable();
    await wr.write(content);
    await wr.close();
  } catch (e) {
    console.warn('Could not write file ' + filename + ' to disk:', e);
  }
}

    custs = [];

  }
  // التوافق مع التعديلات الجديدة: التأكد من وجود cowOn و adjustments
  (custs || []).forEach(c => {

    if (!c.adjustments) c.adjustments = [];
  });
  S.customers = custs || [];

function calcCustomerWeek(cust, week) {
  const days = getCycleDays(week.ws);
  const entries = week.entries || {};
  let cowKg = 0, bufKg = 0;

  for (const d of days) {
    const e = (entries[cust.id] || {})[d] || {};
    if (cust.cowOn !== false && e.cow && e.cow > 0) cowKg += e.cow;
    if (cust.buffOn && e.buf && e.buf > 0) bufKg += e.buf;
  }

  const cowRate = cust.cow || 0;
  const bufRate = cust.buff || 0;
  const cowAmt = cowKg * cowRate;
  const bufAmt = bufKg * bufRate;
  const rawMilkTotal = cowAmt + bufAmt;
  
  let loansTotal = 0; // سلف وخصومات
  let bonusTotal = 0; // زيادات ومكافآت
  let notesList = [];

  if (cust.adjustments && cust.adjustments.length) {
    cust.adjustments.forEach(a => {
      if (days.includes(a.date)) {
        const amt = parseFloat(a.amount) || 0;
        if (a.type === 'sub') {
          loansTotal += amt;
          if (a.note) notesList.push(`خصم: ${a.note} (${amt}ج)`);
          else notesList.push(`سلفة: ${amt}ج`);
        } else {
          bonusTotal += amt;
          if (a.note) notesList.push(`زيادة: ${a.note} (${amt}ج)`);
          else notesList.push(`زيادة: ${amt}ج`);
        }
      }
    });
  }

  const adjTotal = bonusTotal - loansTotal;
  const total = Math.max(0, rawMilkTotal + adjTotal);

  return { cowKg, bufKg, totalKg: cowKg + bufKg, cowAmt, bufAmt, rawMilkTotal, loansTotal, bonusTotal, adjTotal, notesList, total };
}

                ${subTotal > 0 ? `${subTotal.toFixed(2)} ج.م` : 'لم يسجل'}
              </div>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 6px;">
              <div style="flex: 1.2;">

function updateGlobalFactoryPrice() {
  const inp = document.getElementById('globalFactoryPriceInput');
  const price = inp ? parseFloat(inp.value) || 0 : 0;
  S.factoryPrice = price;
  localSet('factory_price', price);
  showToast(`✅ تم تحديد سعر المعمل الثابت: ${price} ج.م/كجم لجميع الأيام`, 'ok');
  renderFactoryView(document.getElementById('mainContainer'));
}

function handleFactoryInput(dateStr, field, val) {
  if (!S.week.factoryEntries) S.week.factoryEntries = {};
  if (!S.week.factoryEntries[dateStr]) S.week.factoryEntries[dateStr] = {};
  S.week.factoryEntries[dateStr][field] = val !== '' ? (parseFloat(val) || 0) : '';
  saveWeek();
}

          <div style="font-size: 10px; color: var(--muted);">

function renderDailyCustomerCard(cust, dateStr, week) {
  const entry = (week.entries[cust.id] || {})[dateStr] || {};
  const cowVal = (entry.cow && entry.cow > 0) ? entry.cow : '';
  const bufVal = (entry.buf && entry.buf > 0) ? entry.buf : '';

  const cowKg = (cust.cowOn !== false) ? (parseFloat(cowVal) || 0) : 0;
  const bufKg = cust.buffOn ? (parseFloat(bufVal) || 0) : 0;
  const totalMoney = (cowKg * (cust.cow || 0)) + (bufKg * (cust.buff || 0));

  return `
    <div class="daily-card" id="card-${cust.id}">
      <div class="daily-card-top">
        <div class="daily-card-name">${cust.name}</div>
        <div class="daily-card-money" id="money-${cust.id}">
          ${totalMoney > 0 ? `${totalMoney.toFixed(2)} ج.م` : ''}
        </div>
      </div>

      ${cust.cowOn !== false ? `
        <div class="input-row">
          <span class="input-badge">🐄 بقر</span>
          <input 
            class="qty-input" 
            type="number" 
            step="any" 
            min="0"
            placeholder="أدخل الكمية"
            id="cow-${cust.id}" 
            value="${cowVal}" 
            oninput="handleMilkInput('${cust.id}')"
            onkeydown="if(event.key==='Enter')focusNextCustomer('${cust.id}')"
          >
          <span class="price-note">${cust.cow ? cust.cow + ' ج' : 'بدون سعر'}</span>
        </div>

        <div class="frac-bar">
          <button type="button" class="frac-btn" onclick="applyFraction('cow-${cust.id}','${cust.id}',0.25)">+ ربع</button>
          <button type="button" class="frac-btn" onclick="applyFraction('cow-${cust.id}','${cust.id}',0.5)">+ نص</button>
          <button type="button" class="frac-btn" onclick="applyFraction('cow-${cust.id}','${cust.id}',0.75)">+ تلات أرباع</button>
          <button type="button" class="frac-btn" onclick="applyFraction('cow-${cust.id}','${cust.id}',1)">+ كيلو</button>
          <button type="button" class="frac-btn clear" onclick="applyFraction('cow-${cust.id}','${cust.id}',0)">مسح ✕</button>
        </div>
      ` : ''}

      ${cust.buffOn ? `
        <div class="input-row" style="margin-top: 6px;">
          <span class="input-badge">🐃 جاموس</span>
          <input 
            class="qty-input" 
            type="number" 
            step="any" 
            min="0"
            placeholder="أدخل الكمية"
            id="buf-${cust.id}" 
            value="${bufVal}" 
            oninput="handleMilkInput('${cust.id}')"
            onkeydown="if(event.key==='Enter')focusNextCustomer('${cust.id}')"
          >
          <span class="price-note">${cust.buff ? cust.buff + ' ج' : 'بدون سعر'}</span>
        </div>
        <div class="frac-bar">
          <button type="button" class="frac-btn" onclick="applyFraction('buf-${cust.id}','${cust.id}',0.25)">+ ربع</button>
          <button type="button" class="frac-btn" onclick="applyFraction('buf-${cust.id}','${cust.id}',0.5)">+ نص</button>
          <button type="button" class="frac-btn" onclick="applyFraction('buf-${cust.id}','${cust.id}',0.75)">+ تلات أرباع</button>
          <button type="button" class="frac-btn" onclick="applyFraction('buf-${cust.id}','${cust.id}',1)">+ كيلو</button>
          <button type="button" class="frac-btn clear" onclick="applyFraction('buf-${cust.id}','${cust.id}',0)">مسح ✕</button>
        </div>
      ` : ''}

      <div style="text-align: left; margin-top: 4px;">
        <button type="button" class="btn btn-outline btn-sm" style="font-size: 11px; padding: 4px 8px; width: auto;" onclick="focusNextCustomer('${cust.id}')">
          حفظ وتالي ⬇️
        </button>
      </div>
    </div>
  `;
}

function handleMilkInput(custId) {
  const cust = S.customers.find(c => c.id === custId);
  if (!cust) return;

  const cowInp = document.getElementById(`cow-${custId}`);
  const bufInp = document.getElementById(`buf-${custId}`);

  const cowNum = (cust.cowOn !== false && cowInp) ? (parseFloat(cowInp.value) || 0) : 0;
  const bufNum = (cust.buffOn && bufInp) ? (parseFloat(bufInp.value) || 0) : 0;

  const total = (cowNum * (cust.cow || 0)) + (bufNum * (cust.buff || 0));

  const moneyEl = document.getElementById(`money-${custId}`);
  if (moneyEl) moneyEl.textContent = total > 0 ? `${total.toFixed(2)} ج.م` : '';

  if (!S.week.entries[custId]) S.week.entries[custId] = {};
  if (!S.week.entries[custId][S.date]) S.week.entries[custId][S.date] = {};

  if (cowNum > 0) S.week.entries[custId][S.date].cow = cowNum;
  else delete S.week.entries[custId][S.date].cow;

  if (cust.buffOn && bufNum > 0) S.week.entries[custId][S.date].buf = bufNum;
  else delete S.week.entries[custId][S.date].buf;

  saveWeek();
}

function setDailyFilterMode(mode) {
  S.dailyFilterMode = mode;
  localSet('daily_filter_mode', mode);
  updateDailyCardsVisibility();
  // تحديث حالة الأزرار
  const container = document.getElementById('mainContainer');
  if (container) renderDailyView(container);
}

function hasCustomerRecordedToday(custId, dateStr, week) {
  const e = (week.entries[custId] || {})[dateStr] || {};
  return (e.cow !== undefined && e.cow > 0) || (e.buf !== undefined && e.buf > 0);
}

function updateDailyCardsVisibility() {
  const mode = S.dailyFilterMode || 'next';
  const query = (S.searchQueryDaily || '').trim().toLowerCase();
  const curDate = S.date;
  const w = S.week;

  let firstUncollectedFound = false;

  S.customers.forEach(c => {
    const card = document.getElementById(`card-${c.id}`);
    if (!card) return;

    const nameMatch = !query || c.name.toLowerCase().includes(query);
    const recorded = hasCustomerRecordedToday(c.id, curDate, w);

    let modeMatch = true;
    if (mode === 'collected') {
      modeMatch = recorded;
    } else if (mode === 'uncollected') {
      modeMatch = !recorded;
    } else if (mode === 'next') {
      // اللي عليه الدور بس: أول واحد لسه متجمعش
      if (!recorded && !firstUncollectedFound) {
        modeMatch = true;
        firstUncollectedFound = true;
      } else {
        modeMatch = false;
      }
    } else if (mode === 'all') {
      modeMatch = true;
    }

    card.style.display = (nameMatch && modeMatch) ? '' : 'none';
  });
}

function focusNextCustomer(currentCustId) {
  handleMilkInput(currentCustId);
  const curDate = S.date;
  const w = S.week;

  if (S.dailyFilterMode === 'next') {
    // في وضع "اللي عليه الدور": الزبون المسجل يختفي فوراً ويظهر التالي
    updateDailyCardsVisibility();
    const nextCard = document.querySelector('#dailyCardsList .daily-card:not([style*="display: none"])');
    if (nextCard) {
      nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const nextInput = nextCard.querySelector('.qty-input');
      if (nextInput) nextInput.focus();
    } else {
      showToast('🎉 ممتاز! تم جمع اللبن من جميع الزبائن لهذا اليوم!', 'ok');
    }
  } else {
    // الأوضاع الأخرى: انتقال سلس للبطاقة المرئية التالية
    const visibleCards = Array.from(document.querySelectorAll('#dailyCardsList .daily-card'))
      .filter(c => c.style.display !== 'none');
    const currentIndex = visibleCards.findIndex(c => c.id === `card-${currentCustId}`);
    if (currentIndex !== -1 && currentIndex < visibleCards.length - 1) {
      const nextCard = visibleCards[currentIndex + 1];
      nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const nextInput = nextCard.querySelector('.qty-input');
      if (nextInput) nextInput.focus();
    } else {
      showToast('✅ تم الوصول لآخر زبون في القائمة اليوم', 'ok');
    }
  }
}

function saveDayEntries() {
  S.customers.forEach(c => handleMilkInput(c.id));
  saveWeek();
  showToast(`✅ تم حفظ بيانات يوم ${getDayNameAr(S.date)} (${formatDateAr(S.date)}) بنجاح`, 'ok');
}

function selectDailyDate(d) {
  S.date = d;
  renderDailyView(document.getElementById('mainContainer'));
}

function handleSearchDaily(q) {
  S.searchQueryDaily = q;
  updateDailyCardsVisibility();
}

// ══════════════════════════════════════════════════════════════════════════
function openCalendarPicker() {
  const curD = parseYMD(S.date);
  S.calMonth = curD.getMonth();
  S.calYear = curD.getFullYear();
  openModal('calendar');
}

function renderCalendarModalHTML() {
  const monthName = AR_MONTHS[S.calMonth];
  const year = S.calYear;

  const firstDayObj = new Date(year, S.calMonth, 1, 12, 0, 0);
  const firstDayIndex = firstDayObj.getDay();
  const offset = (firstDayIndex - 4 + 7) % 7;
  const daysInMonth = new Date(year, S.calMonth + 1, 0).getDate();
  const realTodayYMD = formatYMD(new Date());

  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(`<div></div>`);
  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = `${year}-${String(S.calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const isToday = dStr === realTodayYMD;
    const isSelected = dStr === S.date;
    const isWed = parseYMD(dStr).getDay() === 3;
    cells.push(`
      <button 
        type="button" 
        class="cal-day-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''} ${isWed ? 'payout' : ''}" 
        onclick="pickCalendarDate('${dStr}')"
      >
        ${day}
      </button>
    `);
  }

  return `
    <div class="modal-head">
      <div class="modal-title">📅 التقويم الشامل — اختيار التاريخ</div>
      <button class="modal-close" type="button" onclick="closeModal()">✕</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <button class="btn btn-sm btn-outline" style="width: auto;" type="button" onclick="changeCalMonth(-1)">◀ شهر سابق</button>
      <div style="font-weight: 800; font-size: 14px; color: var(--navy);">${monthName} ${year}</div>
      <button class="btn btn-sm btn-outline" style="width: auto;" type="button" onclick="changeCalMonth(1)">شهر تالي ▶</button>
    </div>

    <div class="cal-grid">
      <div class="cal-head">خميس</div>
      <div class="cal-head">جمعة</div>
      <div class="cal-head">سبت</div>
      <div class="cal-head">أحد</div>
      <div class="cal-head">اثنين</div>
      <div class="cal-head">ثلاث</div>
      <div class="cal-head" style="color: var(--green);">أربع 💰</div>
      ${cells.join('')}
    </div>

    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <button class="btn btn-primary btn-sm" type="button" onclick="pickCalendarDate('${formatYMD(new Date())}')" style="flex: 1;">
        📍 الذهاب إلى تاريخ اليوم (${formatDateAr(formatYMD(new Date()))})
      </button>
      <button class="btn btn-outline btn-sm" type="button" onclick="closeModal()" style="flex: 1;">إغلاق</button>
    </div>
  `;
}

function changeCalMonth(delta) {
  S.calMonth += delta;
  if (S.calMonth < 0) { S.calMonth = 11; S.calYear--; }
  else if (S.calMonth > 11) { S.calMonth = 0; S.calYear++; }
  render();
}

function pickCalendarDate(dStr) {
  S.date = dStr;
  const thur = getWeekStartThursday(dStr);
  S.currentWs = thur;
  let w = localGet('week_' + thur);
  if (!w) {
    w = { ws: thur, entries: {}, paid: {}, closed: false };
    localSet('week_' + thur, w);
  }
  S.week = w;
  closeModal();
  goView('daily');
  showToast(`📅 تم الانتقال إلى يوم ${getDayNameAr(dStr)} ${formatDateAr(dStr)}`, 'ok');
}

function openModal(m) {
  S.modal = m;
  render();
  setTimeout(() => {
    const inp = document.getElementById('singleCustName');
    if (inp) inp.focus();
  }, 100);
}

function closeModal() {
  S.modal = null;
  S.editId = null;
  render();
}

function closeConfirm() {
  S.confirm = null;
  render();
}

function addHalfToInput(id) {
  const inp = document.getElementById(id);
  if (!inp) return;
  const val = parseFloat(inp.value) || 0;
  if (val % 1 === 0.5) {
    inp.value = Math.floor(val);
  } else {
    inp.value = (Math.floor(val) + 0.5);
  }
}

function syncCurrentBulkRowsFromDOM() {
  S.bulkRows.forEach((r, i) => {
    const nEl = document.getElementById(`br-name-${i}`);
    const cEl = document.getElementById(`br-cow-${i}`);
    const bEl = document.getElementById(`br-buf-${i}`);
    if (nEl) r.name = nEl.value;
    if (cEl) r.cow = cEl.value;
    if (bEl) r.buf = bEl.value;
  });
}

function appendBulkRowItem() {
  syncCurrentBulkRowsFromDOM();
  S.bulkRows.push({ name: '', cow: '', buf: '' });
  render();
}

function removeBulkRowItem(idx) {
  syncCurrentBulkRowsFromDOM();
  S.bulkRows.splice(idx, 1);
  if (!S.bulkRows.length) S.bulkRows.push({ name: '', cow: '', buf: '' });
  render();
}

function parseFastPaste() {
  const box = document.getElementById('bulkFastPasteBox');
  if (!box || !box.value.trim()) return;
  const lines = box.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const parsed = [];
  lines.forEach(line => {
    const parts = line.split(/\s+/);
    let cow = '', buf = '', nameParts = [];
    parts.forEach(part => {
      const num = parseFloat(part);
      if (!isNaN(num) && /^[0-9]+(\.[0-9]+)?$/.test(part)) {
        if (!cow) cow = part;
        else if (!buf) buf = part;
        else nameParts.push(part);
      } else {
        nameParts.push(part);
      }
    });
    parsed.push({ name: nameParts.join(' '), cow, buf });
  });
  if (parsed.length) {
    S.bulkRows = parsed;
    render();
    showToast(`تم توزيع ${parsed.length} زبون بالأسعار في الجدول`, 'ok');
  }
}

function submitBulkRows() {
  try {
    syncCurrentBulkRowsFromDOM();
    const valid = S.bulkRows.filter(r => r.name.trim().length > 0);
    if (!valid.length) {
      showToast('⚠️ يرجى كتابة اسم زبون واحد على الأقل', 'warn');
      return;
    }

    let count = 0;
    valid.forEach(r => {
      const cowPrice = parseFloat(r.cow) || 0;
      const bufPrice = parseFloat(r.buf) || 0;
      S.customers.push({
        id: uid(),
        name: r.name.trim(),
        cowOn: cowPrice > 0 || bufPrice <= 0,
        cow: cowPrice > 0 ? cowPrice : 0,
        buffOn: bufPrice > 0,
        buff: bufPrice > 0 ? bufPrice : 0,
        adjustments: [],
        addedAt: S.date
      });
      count++;
    });

    saveCustomers();
    closeModal();
    showToast(`✅ تمت إضافة ${count} زبون بنجاح وكل زبون مسجل لوحده!`, 'ok');
  } catch (err) {
    console.error('Error adding bulk customers:', err);
    showToast('❌ حدث خطأ أثناء الحفظ: ' + err.message, 'err');
  }
}

function openAdjustmentModal(custId) {
  S.adjCustId = custId;
  openModal('adjustment');
}

function updateAdjTypeHighlight() {
  const isSub = document.querySelector('input[name="adjType"]:checked')?.value === 'sub';
  const subLbl = document.getElementById('lblAdjSub');
  const addLbl = document.getElementById('lblAdjAdd');
  if (subLbl && addLbl) {
    subLbl.style.borderColor = isSub ? 'var(--red)' : 'var(--border)';
    subLbl.style.background = isSub ? 'var(--red-soft)' : '#fff';
    addLbl.style.borderColor = !isSub ? 'var(--blue)' : 'var(--border)';
    addLbl.style.background = !isSub ? 'var(--blue-soft)' : '#fff';
  }
}

function submitAdjustment() {
  const cust = S.customers.find(c => c.id === S.adjCustId);
  if (!cust) return;
  const type = document.querySelector('input[name="adjType"]:checked')?.value || 'sub';
  const amountEl = document.getElementById('adjAmount');
  const noteEl = document.getElementById('adjNote');
  const amount = amountEl ? parseFloat(amountEl.value) : 0;
  const note = noteEl ? noteEl.value.trim() : '';

  if (!amount || amount <= 0) {
    showToast('⚠️ يرجى إدخال مبلغ صحيح', 'warn');
    if (amountEl) amountEl.focus();
    return;
  }

  if (!cust.adjustments) cust.adjustments = [];
  cust.adjustments.push({
    id: uid(),
    date: S.date,
    type: type,
    amount: amount,
    note: note
  });

  saveCustomers();
  closeModal();
  showToast(`✅ تم تسجيل ${type === 'add' ? 'الزيادة' : 'الخصم'} بمبلغ ${amount} ج.م بنجاح`, 'ok');
}

function deleteAdjustment(custId, adjId) {
  const cust = S.customers.find(c => c.id === custId);
  if (!cust || !cust.adjustments) return;
  cust.adjustments = cust.adjustments.filter(a => a.id !== adjId);
  saveCustomers();
  showToast('🗑️ تم حذف حركة التسوية', 'ok');
}

function openEditModal(id) {
  S.editId = id;
  S.modal = 'edit';
  render();
}

function toggleMilkTypeInputs() {
  const chkCow = document.getElementById('chkCowOn');
  const chkBuff = document.getElementById('chkBuffOn');
  const grpCow = document.getElementById('grpCowPrice');
  const grpBuff = document.getElementById('grpBuffPrice');
  if (grpCow && chkCow) grpCow.style.display = chkCow.checked ? '' : 'none';
  if (grpBuff && chkBuff) grpBuff.style.display = chkBuff.checked ? '' : 'none';
}

function submitSingleCustomer() {
  try {
    const nameEl = document.getElementById('singleCustName');
    const chkCow = document.getElementById('chkCowOn');
    const chkBuff = document.getElementById('chkBuffOn');
    const cowEl = document.getElementById('singleCustCow');
    const bufEl = document.getElementById('singleCustBuf');

    const name = nameEl ? nameEl.value.trim() : '';
    const cowOn = chkCow ? chkCow.checked : true;
    const buffOn = chkBuff ? chkBuff.checked : false;

    if (!name) {
      showToast('❌ أدخل اسم الزبون', 'err');
      if (nameEl) nameEl.focus();
      return;
    }

    if (!cowOn && !buffOn) {
      showToast('⚠️ يجب اختيار نوع واحد على الأقل من اللبن (بقر أو جاموس)', 'warn');
      return;
    }

    const cow = (cowOn && cowEl && cowEl.value) ? parseFloat(cowEl.value) : 0;
    const buf = (buffOn && bufEl && bufEl.value) ? parseFloat(bufEl.value) : 0;

    if (S.modal === 'edit' && S.editId) {
      const idx = S.customers.findIndex(c => c.id === S.editId);
      if (idx !== -1) {
        S.customers[idx].name = name;
        S.customers[idx].cowOn = cowOn;
        S.customers[idx].cow = cow;
        S.customers[idx].buffOn = buffOn;
        S.customers[idx].buff = buf;
        saveCustomers();
        showToast('✅ تم تعديل بيانات الزبون بنجاح', 'ok');
      }
    } else {
      const newCust = {
        id: uid(),
        name: name,
        cowOn: cowOn,
        cow: cow,
        buffOn: buffOn,
        buff: buf,
        adjustments: [],
        addedAt: S.date
      };
      S.customers.push(newCust);
      saveCustomers();
      showToast('✅ تم حفظ الزبون الجديد بنجاح', 'ok');
    }

    closeModal();
  } catch (err) {
    console.error('Error saving single customer:', err);
    showToast('❌ حدث خطأ أثناء الحفظ: ' + err.message, 'err');
  }
}

function confirmDeleteCustomer(id) {
  const c = S.customers.find(x => x.id === id);
  if (!c) return;
  S.confirm = {
    title: 'حذف الزبون',
    msg: `هل تريد حذف "${c.name}" نهائياً من السيستم؟`,
    icon: '🗑️',
    fn: `executeDeleteCustomer('${id}')`
  };
  render();
}

function executeDeleteCustomer(id) {
  S.customers = S.customers.filter(c => c.id !== id);
  saveCustomers();
  closeConfirm();
  showToast('🗑️ تم حذف الزبون بنجاح', 'ok');
}

function confirmCloseWeek() {
  const w = S.week;
  const days = getCycleDays(w.ws);
  S.confirm = {
    title: '🔄 تصفية وإغلاق حساب الأسبوع',
    msg: `هل قمت بتسليم كل الزباين فلوسهم يوم الأربعاء (${formatDateAr(days[6])}) وتريد أرشفة الأسبوع وبدء أسبوع جديد من الخميس؟`,
    icon: '💰',
    btnClass: 'btn-success',
    fn: 'executeCloseWeek()'
  };
  render();
}

function executeCloseWeek() {
  const curWeek = S.week;
  const archived = {
    ...curWeek,
    closed: true,
    closedAt: new Date().toISOString(),
    snapshot: JSON.parse(JSON.stringify(S.customers))
  };

  localSet('week_' + curWeek.ws, archived);

  S.history.push(archived);
  localSet('history', S.history);

  const startD = parseYMD(curWeek.ws);
  startD.setDate(startD.getDate() + 7);
  const nextWs = formatYMD(startD);

  const newWeek = { ws: nextWs, entries: {}, paid: {}, closed: false };
  localSet('week_' + nextWs, newWeek);

  S.week = newWeek;
  S.currentWs = nextWs;
  S.date = nextWs;

  closeConfirm();
  showToast('🎉 تم إغلاق الأسبوع بنجاح وبدء دورة الأسبوع الجديد (من الخميس)!', 'ok');
  goView('home');
}

function navWeek(delta) {
  const curD = parseYMD(S.currentWs);
  curD.setDate(curD.getDate() + (delta * 7));
  const newWs = formatYMD(curD);
  S.currentWs = newWs;

  let w = localGet('week_' + newWs);
  if (!w) {
    w = { ws: newWs, entries: {}, paid: {}, closed: false };
    localSet('week_' + newWs, w);
  }
  S.week = w;
  S.date = newWs;
  render();
}

function shareCustomerWhatsApp(cId) {
  const cust = S.customers.find(c => c.id === cId);
  if (!cust) return;
  const w = S.week;
  const days = getCycleDays(w.ws);
  const res = calcCustomerWeek(cust, w);

  let daysText = '';
  days.forEach(d => {
    const e = (w.entries[cust.id] || {})[d] || {};
    const cow = e.cow || 0;
    const buf = cust.buffOn ? (e.buf || 0) : 0;
    const tot = cow + buf;
    if (tot > 0) {
      daysText += `• ${getDayNameAr(d)} (${formatDateAr(d)}): ${formatKgArabic(tot)}\n`;
    }
  });

  const msg = 
`السلام عليكم يا ${cust.name} 🥛
كشف حساب توريد اللبن من *متجر أبو يوسف للألبان*
📅 الأسبوع: ${getCycleLabel(w.ws)}
-----------------------------
تفاصيل توريدك بالأيام:
${daysText || '• لم تسجل كميات\n'}-----------------------------
🐄 إجمالي لبن بقر: ${res.cowKg.toFixed(2)} كجم (${cust.cow || 0} ج) = ${res.cowAmt.toFixed(2)} ج.م
${cust.buffOn && res.bufKg > 0 ? `🐃 إجمالي لبن جاموس: ${res.bufKg.toFixed(2)} كجم (${cust.buff || 0} ج) = ${res.bufAmt.toFixed(2)} ج.م\n` : ''}-----------------------------
💰 *إجمالي المبلغ المستحق لك يوم الأربعاء: ${res.total.toFixed(2)} ج.م*
شكراً لتعاملكم الطيب معنا! 🙏`;

  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function shareGeneralWhatsApp() {
  const w = S.week;
  let totMoney = 0;
  let totKg = 0;
  S.customers.forEach(c => {
    const r = calcCustomerWeek(c, w);
    totMoney += r.total;
    totKg += r.totalKg;
  });

  const msg = 
`📊 *كشف حساب أسبوع: متجر أبو يوسف للألبان*
📅 ${getCycleLabel(w.ws)}
-----------------------------
👥 عدد الزباين: ${S.customers.length}
🥛 إجمالي كمية اللبن: ${totKg.toFixed(2)} كجم
💰 إجمالي فلوس الأسبوع لتسليم الأربعاء: ${totMoney.toLocaleString('ar-EG')} ج.م
-----------------------------
تاريخ التقرير: ${getDayNameAr(S.date)} ${formatDateAr(S.date)}`;

  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function exportWeekCSV() {
  const w = S.week;
  const days = getCycleDays(w.ws);
  const rows = [];

  rows.push(['الزبون', ...days.map(d => `${getDayNameAr(d)} (${formatDateAr(d)})`), 'إجمالي الكيلو', 'المبلغ ج.م'].join(','));

  S.customers.forEach(c => {
    const res = calcCustomerWeek(c, w);
    const dayCols = days.map(d => {
      const e = (w.entries[c.id] || {})[d] || {};
      return (e.cow || 0) + (e.buf || 0);
    });
    rows.push([`"${c.name}"`, ...dayCols, res.totalKg.toFixed(2), res.total.toFixed(2)].join(','));
  });

  const csv = '\uFEFF' + rows.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = `حساب-أسبوع-${w.ws}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('✅ تم تنزيل ملف Excel بنجاح', 'ok');
}

function downloadBackupJSON() {
  const data = {
    version: '7.0',
    cycle: 'ThursdayToWednesday',
    customers: S.customers,
    week: S.week,
    history: S.history
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `نسخة-أبو-يوسف-${S.date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('💾 تم تنزيل النسخة الاحتياطية', 'ok');
}

function triggerRestoreInput() {
  const f = document.getElementById('restoreFileInput');
  if (f) f.click();
}

function handleRestoreFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (d.customers) { S.customers = d.customers; saveCustomers(); }
      if (d.week) { S.week = d.week; saveWeek(); }
      if (d.history) { S.history = d.history; localSet('history', S.history); }
      closeModal();
      showToast('✅ تم استرجاع البيانات بنجاح', 'ok');
      render();
    } catch (err) { showToast('❌ ملف غير صالح', 'err'); }
  };
  reader.readAsText(file);
}

function goView(v) {
  S.view = v;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let _tTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = `toast-msg show ${type}`;
  clearTimeout(_tTimer);
  _tTimer = setTimeout(() => { el.classList.remove('show'); }, 3000);
}

// ══════════════════════════════════════════════════════════════════════════
//  SERVICE WORKER REGISTRATION WITH UPDATE PROMPT
// ══════════════════════════════════════════════════════════════════════════
let newWorker;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        newWorker = reg.installing;
        if (newWorker) {
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner();
            }
          });
        }
      });
    }).catch(() => {});

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  });
}

function showUpdateBanner() {
  const existing = document.getElementById('updateNotificationBanner');
  if (existing) return;
  const banner = document.createElement('div');
  banner.id = 'updateNotificationBanner';
  banner.style.cssText = 'position:fixed; top:12px; left:14px; right:14px; max-width:572px; margin:0 auto; z-index:9999; background:linear-gradient(135deg, #2563eb, #1d4ed8); color:#fff; border-radius:12px; padding:12px 14px; box-shadow:0 10px 25px rgba(0,0,0,0.2); display:flex; align-items:center; justify-content:space-between; gap:10px; animation:slideDown 0.3s ease;';
  banner.innerHTML = `
    <div>
      <div style="font-weight:800; font-size:13px;">🆕 يتوفر تحديث جديد للتطبيق!</div>
      <div style="font-size:11px; opacity:0.9;">اضغط لتطبيق التحديث فوراً دون التأثير على بياناتك</div>
    </div>
    <button class="btn btn-sm" style="background:#fff; color:var(--blue); font-weight:800; white-space:nowrap; padding:6px 12px;" onclick="applyAppUpdate()">
      تحديث الآن ⚡
    </button>
  `;
  document.body.appendChild(banner);
}

function applyAppUpdate() {
  if (newWorker) {
    newWorker.postMessage({ type: 'SKIP_WAITING' });
  } else {
    window.location.reload();
  }
}

async function start() {
  await loadData();
  render();
}

start();
