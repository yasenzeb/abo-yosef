<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1e38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أبو يوسف للألبان">
<meta name="mobile-web-app-capable" content="yes">
<title>أبو يوسف للألبان - إدارة وتوريد الألبان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0b1e38;
  --navy-light: #162f55;
  --blue: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-soft: #eff6ff;
  --green: #059669;
  --green-hover: #047857;
  --green-soft: #ecfdf5;
  --amber: #d97706;
  --amber-soft: #fffbeb;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --ink: #0f172a;
  --ink-secondary: #475569;
  --muted: #64748b;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --shadow-sm: 0 1px 3px rgba(11,30,56,.06);
  --shadow-md: 0 4px 14px rgba(11,30,56,.08);
  --font: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  min-height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  direction: rtl;
  text-align: right;
  -webkit-font-smoothing: antialiased;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  max-width: 600px;
  margin: 0 auto;
  background: var(--bg);
  box-shadow: 0 0 40px rgba(0,0,0,.04);
}

/* ─── HEADER ─── */
.app-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  color: #fff;
  padding: 12px 14px;
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: var(--shadow-md);
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  width: 38px;
  height: 38px;
  background: rgba(255,255,255,.14);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.brand-title {
  font-size: 16px;
  font-weight: 800;
  line-height: 1.2;
}
.brand-subtitle {
  font-size: 11px;
  color: #cbd5e1;
  font-weight: 500;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.header-btn {
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.2);
  color: #fff;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}

/* ─── WEEK CYCLE BAR (الخميس إلى الأربعاء) ─── */
.week-cycle-bar {
  background: rgba(255,255,255,.08);
  border-radius: 10px;
  padding: 8px 10px;
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: #e2e8f0;
}
.week-nav-btn {
  background: rgba(255,255,255,.16);
  border: none;
  color: #fff;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.week-nav-btn:active {
  background: rgba(255,255,255,.3);
}

/* ─── MAIN CONTAINER ─── */
.main-view {
  flex: 1;
  padding: 12px 14px calc(76px + var(--safe-bottom)) 14px;
  overflow-y: auto;
}

/* ─── BOTTOM NAV ─── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 600px;
  margin: 0 auto;
  background: rgba(255,255,255,.98);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 50;
  padding-bottom: var(--safe-bottom);
  box-shadow: 0 -4px 16px rgba(11,30,56,.06);
}
.nav-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px 6px;
  border: none;
  background: none;
  color: var(--muted);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  gap: 3px;
  position: relative;
}
.nav-tab .tab-icon {
  font-size: 20px;
  line-height: 1;
}
.nav-tab.active {
  color: var(--blue);
  font-weight: 800;
}
.nav-tab.active::after {
  content: '';
  position: absolute;
  top: 0;
  width: 26px;
  height: 3px;
  background: var(--blue);
  border-radius: 0 0 3px 3px;
}

/* ─── CARDS ─── */
.card {
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 13px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid #f1f5f9;
}
.card-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ─── STATS GRID ─── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 12px;
}
.stat-card {
  background: var(--surface);
  border-radius: var(--r-md);
  padding: 12px 14px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 3px;
  background: var(--blue);
}
.stat-card.green::before { background: var(--green); }
.stat-value {
  font-size: 20px;
  font-weight: 900;
  color: var(--navy);
  line-height: 1.2;
}
.stat-card.green .stat-value { color: var(--green); }
.stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  margin-top: 3px;
}

/* ─── BUTTONS ─── */
.btn {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  transition: all .12s;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--blue); color: #fff; }
.btn-success { background: var(--green); color: #fff; }
.btn-amber { background: var(--amber); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-outline { background: #fff; border: 1.5px solid var(--border); color: var(--navy); }
.btn-outline:active { background: #f8fafc; border-color: var(--blue); }
.btn-sm { padding: 5px 10px; font-size: 12px; width: auto; border-radius: 8px; }

/* ─── SEARCH INPUT ─── */
.search-wrap {
  position: relative;
  margin-bottom: 10px;
}
.search-input {
  width: 100%;
  padding: 9px 34px 9px 12px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
}
.search-input:focus {
  outline: none;

  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.search-icon {
  position: absolute;

/* ─── 7 DAYS SELECTOR BAR (الخميس -> الأربعاء) ─── */
.days-bar {
  display: flex;

  gap: 6px;
  padding: 4px 2px 10px 2px;
  margin-bottom: 8px;
  scrollbar-width: none;
}
.days-bar::-webkit-scrollbar { display: none; }
.day-chip {
  flex: 1;
  min-width: 62px;
  padding: 8px 6px;
  border-radius: 12px;
  background: #fff;
  border: 1.5px solid var(--border);
  font-family: inherit;
  cursor: pointer;
  text-align: center;
  color: var(--ink-secondary);
  position: relative;
  transition: all .15s;
}
.day-chip .chip-name { font-size: 11px; font-weight: 700; }
.day-chip .chip-date { font-size: 13px; font-weight: 800; margin-top: 1px; }
.day-chip.active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
  box-shadow: 0 3px 8px rgba(11,30,56,.2);
}
.day-chip.is-payout::before {
  content: 'القبض 💰';
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  background: #059669;
  color: #fff;
  font-size: 8px;
  font-weight: 900;
  padding: 1px 5px;
  border-radius: 4px;
  white-space: nowrap;
}

/* ─── DAILY ENTRY CARD ─── */
.daily-card {
  background: #fff;
  border-radius: var(--r-md);
  padding: 12px 14px;
  margin-bottom: 9px;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid var(--border);
}
.daily-card:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.07);
}
.daily-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.daily-card-name {
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
}
.daily-card-money {
  font-size: 12px;
  font-weight: 800;
  color: var(--green);
  background: var(--green-soft);
  padding: 2px 7px;
  border-radius: 6px;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.input-badge {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-secondary);
  background: #f1f5f9;
  padding: 6px 8px;
  border-radius: 8px;
  min-width: 66px;
  text-align: center;
}
.qty-input {
  flex: 1;
  padding: 8px 10px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 16px;
  font-weight: 800;
  font-family: inherit;
  text-align: center;
  color: var(--navy);
  background: #fff;
}
.qty-input:focus {
  outline: none;
  border-color: var(--blue);
  background: var(--blue-soft);
}
.price-note {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}

/* ─── FRACTIONS IN ARABIC ─── */
.frac-bar {
  display: flex;
  gap: 5px;
  margin-top: 3px;
  margin-bottom: 8px;
  margin-right: 74px;
  flex-wrap: wrap;
}
.frac-btn {
  padding: 4px 9px;
  border-radius: 7px;
  border: 1.5px solid #bfdbfe;
  background: #f0f7ff;
  color: var(--blue);
  font-size: 11px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
}
.frac-btn:active { background: var(--blue); color: #fff; }
.frac-btn.clear { border-color: #fecaca; background: #fff1f2; color: var(--red); }
.frac-btn.clear:active { background: var(--red); color: #fff; }

/* ─── HALF PRICE QUICK BUTTON ─── */
.half-btn {
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid #bfdbfe;
  background: #f0f7ff;
  color: var(--blue);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.half-btn:active { background: var(--blue); color: #fff; }

/* ─── TABLE VIEW ─── */
.table-scroll {
  overflow-x: auto;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 12px;
}
.report-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.report-tbl th {
  background: var(--navy);
  color: #fff;
  padding: 8px 5px;
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  white-space: nowrap;
}
.report-tbl td {
  padding: 8px 5px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.report-tbl tr:nth-child(even) td { background: #f8fafc; }
.report-tbl .total-tr td {
  background: var(--green-soft) !important;
  font-weight: 900;
  color: var(--green);
}

/* ─── CUSTOMER LIST CARDS ─── */
.cust-card {
  background: #fff;
  border-radius: var(--r-md);
  padding: 12px 14px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
}
.cust-name {
  font-size: 14px;
  font-weight: 800;
  color: var(--navy);
}
.cust-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.cust-actions {
  display: flex;
  gap: 5px;
}
.action-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #fff;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.action-btn.wa { color: #059669; border-color: #a7f3d0; background: var(--green-soft); }
.action-btn.edit { color: var(--blue); border-color: #bfdbfe; background: var(--blue-soft); }
.action-btn.del { color: var(--red); border-color: #fecaca; background: var(--red-soft); }

/* ─── MODALS ─── */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(11,30,56,.55);
  backdrop-filter: blur(3px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal-box {
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(24px + var(--safe-bottom));
  width: 100%;
  max-width: 600px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 -10px 40px rgba(0,0,0,.15);
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 15px; font-weight: 800; color: var(--navy); }
.modal-close {
  background: #f1f5f9;
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 15px;
}

/* ─── FORM CONTROLS ─── */
.form-grp { margin-bottom: 12px; }
.form-lbl {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-secondary);
  margin-bottom: 4px;
}
.form-ctl {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  background: #fff;
  direction: rtl;
}
.form-ctl:focus { outline: none; border-color: var(--blue); }

.bulk-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

/* ─── TOAST ─── */
.toast-msg {
  position: fixed;
  bottom: calc(76px + var(--safe-bottom));
  left: 16px;
  right: 16px;
  max-width: 450px;
  margin: 0 auto;
  background: var(--navy);
  color: #fff;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  z-index: 200;
  transform: translateY(20px);
  opacity: 0;
  transition: all .25s;
  pointer-events: none;
}
.toast-msg.show { transform: translateY(0); opacity: 1; }
.toast-msg.ok { background: var(--green); }
.toast-msg.err { background: var(--red); }
.toast-msg.warn { background: var(--amber); }

@media print {
  body { background: #fff; }
  #app { max-width: 100%; box-shadow: none; }
  .bottom-nav, .app-header, .btn, .days-bar, .search-wrap, .frac-bar, .week-cycle-bar { display: none !important; }
  .main-view { padding: 0 !important; }
  .card { box-shadow: none !important; border: 1px solid #000 !important; }
}

<div id="app"></div>
<div id="toast" class="toast-msg"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════
//  APP STATE
// ══════════════════════════════════════════════════════════════════════════
let S = {
  view: 'home',
  customers: [],
  week: null,
  history: [],
  date: '2026-10-12',
  currentWs: '2026-10-08',
  searchQueryDaily: '',
  searchQueryReports: '',
  searchQueryCusts: '',
  modal: null,
  editId: null,
  cDetailId: null,
  confirm: null,
  bulkRows: []
};

const AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const AR_DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

function getSystemTodayStr() {
  const d = new Date();
  if (d.getFullYear() === 2026) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return '2026-10-12';
}

function getWeekStartThursday(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = (day - 4 + 7) % 7;
  const thur = new Date(d);
  thur.setDate(d.getDate() - diff);
  return thur.toISOString().split('T')[0];
}

function getCycleDays(ws) {
  const verifiedWs = getWeekStartThursday(ws);
  const days = [];
  const start = new Date(verifiedWs + 'T00:00:00');
  for (let i = 0; i < 7; i++) {
    const cur = new Date(start);
    cur.setDate(start.getDate() + i);
    days.push(cur.toISOString().split('T')[0]);
  }
  return days;
}

function formatDateAr(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getDate()} ${AR_MONTHS[d.getMonth()]}`;
}

function getDayNameAr(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return AR_DAYS[d.getDay()];
}

function getCycleLabel(ws) {
  const days = getCycleDays(ws);
  return `من الخميس ${formatDateAr(days[0])} إلى الأربعاء ${formatDateAr(days[6])} (يوم القبض)`;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function formatKgArabic(val) {
  if (!val || isNaN(val) || val <= 0) return '0 كجم';
  const num = parseFloat(val);
  const intPart = Math.floor(num);
  const frac = parseFloat((num - intPart).toFixed(4));

  let fracWord = '';
  if (Math.abs(frac - 0.25) < 0.02) fracWord = 'وربع';
  else if (Math.abs(frac - 0.5) < 0.02) fracWord = 'ونصف';
  else if (Math.abs(frac - 0.75) < 0.02) fracWord = 'وتلات أرباع';
  else if (frac > 0) fracWord = `و${frac.toFixed(2)}`;

  if (intPart === 0) {
    if (Math.abs(frac - 0.25) < 0.02) return 'ربع كجم';
    if (Math.abs(frac - 0.5) < 0.02) return 'نصف كجم';
    if (Math.abs(frac - 0.75) < 0.02) return 'تلات أرباع كجم';
    return `${num.toFixed(2)} كجم`;
  }
  return fracWord ? `${intPart} ${fracWord} كجم` : `${intPart} كجم`;
}

function applyFraction(inputId, custId, fracVal) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  const curNum = parseFloat(inp.value.trim()) || 0;
  const intPart = Math.floor(curNum + 0.001);

  if (fracVal === 0) {
    inp.value = '';
  } else if (fracVal === 1) {
    inp.value = curNum > 0 ? (curNum + 1).toFixed(2).replace(/\.00$/, '') : '1';
  } else {
    inp.value = parseFloat((intPart + fracVal).toFixed(4));
  }
  handleMilkInput(custId);
}

function localSet(key, val) {
  try { localStorage.setItem('aby_' + key, JSON.stringify(val)); } catch (e) {}
}
function localGet(key) {
  try {
    const v = localStorage.getItem('aby_' + key);
    return v ? JSON.parse(v) : null;
  } catch (e) { return null; }
}

async function loadData() {
  let custs = localGet('customers');
  if (!custs || !custs.length) {
    try {
      const res = await fetch('customers.json');
      if (res.ok) {
        const json = await res.json();
        if (json.customers) custs = json.customers;
      }
    } catch (e) {}
  }
  S.customers = custs || [];
  S.customers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));

  const todayStr = getSystemTodayStr();
  S.date = todayStr;
  const thurStart = getWeekStartThursday(todayStr);
  S.currentWs = thurStart;

  let weekData = localGet('week_' + thurStart);
  if (!weekData) {
    weekData = { ws: thurStart, entries: {}, paid: {}, closed: false };
    localSet('week_' + thurStart, weekData);
  }
  if (!weekData.paid) weekData.paid = {};
  S.week = weekData;

  S.history = localGet('history') || [];
}

function saveCustomers() { localSet('customers', S.customers); }
function saveWeek() { if (S.week) localSet('week_' + S.week.ws, S.week); }

function calcCustomerWeek(cust, week) {
  const days = getCycleDays(week.ws);
  const entries = week.entries || {};
  let cowKg = 0, bufKg = 0;

  for (const d of days) {
    const e = (entries[cust.id] || {})[d] || {};
    if (e.cow && e.cow > 0) cowKg += e.cow;
    if (cust.buffOn && e.buf && e.buf > 0) bufKg += e.buf;
  }

  const cowRate = cust.cow || 0;
  const bufRate = cust.buff || 0;
  const cowAmt = cowKg * cowRate;
  const bufAmt = bufKg * bufRate;
  const total = cowAmt + bufAmt;

  return { cowKg, bufKg, totalKg: cowKg + bufKg, cowAmt, bufAmt, total };
}

function handleMilkInput(custId) {
  const cust = S.customers.find(c => c.id === custId);
  if (!cust) return;

  const cowInp = document.getElementById(`cow-${custId}`);
  const bufInp = document.getElementById(`buf-${custId}`);

  const cowNum = cowInp ? (parseFloat(cowInp.value) || 0) : 0;
  const bufNum = bufInp ? (parseFloat(bufInp.value) || 0) : 0;

  const total = (cowNum * (cust.cow || 0)) + (cust.buffOn ? (bufNum * (cust.buff || 0)) : 0);

  const moneyEl = document.getElementById(`money-${custId}`);
  if (moneyEl) moneyEl.textContent = total > 0 ? `${total.toFixed(2)} ج.م` : '';

  if (!S.week.entries[custId]) S.week.entries[custId] = {};
  if (!S.week.entries[custId][S.date]) S.week.entries[custId][S.date] = {};

  if (cowNum > 0) S.week.entries[custId][S.date].cow = cowNum;
  else delete S.week.entries[custId][S.date].cow;

  if (cust.buffOn && bufNum > 0) S.week.entries[custId][S.date].buf = bufNum;
  else delete S.week.entries[custId][S.date].buf;

  saveWeek();
}

function saveDayEntries() {

function openModal(m) { S.modal = m; render(); }
function closeModal() { S.modal = null; S.editId = null; render(); }
function closeConfirm() { S.confirm = null; render(); }

function addHalfToInput(id) {
  const inp = document.getElementById(id);
  if (!inp) return;
  const val = parseFloat(inp.value) || 0;
  if (val % 1 === 0.5) {
    inp.value = Math.floor(val);
  } else {
    inp.value = (Math.floor(val) + 0.5);
  }
}

function syncCurrentBulkRowsFromDOM() {
  S.bulkRows.forEach((r, i) => {
    const nEl = document.getElementById(`br-name-${i}`);
    const cEl = document.getElementById(`br-cow-${i}`);
    const bEl = document.getElementById(`br-buf-${i}`);
    if (nEl) r.name = nEl.value;
    if (cEl) r.cow = cEl.value;
    if (bEl) r.buf = bEl.value;
  });
}

function appendBulkRowItem() {
  syncCurrentBulkRowsFromDOM();
  S.bulkRows.push({ name: '', cow: '', buf: '' });
  render();
}

function removeBulkRowItem(idx) {
  syncCurrentBulkRowsFromDOM();
  S.bulkRows.splice(idx, 1);
  if (!S.bulkRows.length) S.bulkRows.push({ name: '', cow: '', buf: '' });
  render();
}

function parseFastPaste() {
  const box = document.getElementById('bulkFastPasteBox');
  if (!box || !box.value.trim()) return;
  const lines = box.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const parsed = [];
  lines.forEach(line => {
    const parts = line.split(/\s+/);
    let cow = '', buf = '', nameParts = [];
    parts.forEach(part => {
      const num = parseFloat(part);
      if (!isNaN(num) && /^[0-9]+(\.[0-9]+)?$/.test(part)) {
        if (!cow) cow = part;
        else if (!buf) buf = part;
        else nameParts.push(part);
      } else {
        nameParts.push(part);
      }
    });
    parsed.push({ name: nameParts.join(' '), cow, buf });
  });
  if (parsed.length) {
    S.bulkRows = parsed;
    render();
    showToast(`تم توزيع ${parsed.length} زبون بالأسعار في الجدول`, 'ok');
  }
}

function submitBulkRows() {
  syncCurrentBulkRowsFromDOM();
  const valid = S.bulkRows.filter(r => r.name.trim().length > 0);
  if (!valid.length) {
    showToast('⚠️ يرجى كتابة اسم زبون واحد على الأقل', 'warn');
    return;
  }

  let count = 0;
  valid.forEach(r => {
    const cowPrice = parseFloat(r.cow) || 0;
    const bufPrice = parseFloat(r.buf) || 0;
    S.customers.push({
      id: uid(),
      name: r.name.trim(),
      cow: cowPrice > 0 ? cowPrice : 0,
      buffOn: bufPrice > 0,
      buff: bufPrice > 0 ? bufPrice : 0,
      addedAt: S.date
    });
    count++;
  });

  S.customers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  saveCustomers();
  closeModal();
  showToast(`✅ تمت إضافة ${count} زبون بنجاح وكل زبون مسجل لوحده!`, 'ok');
}

function openEditModal(id) {
  S.editId = id;
  S.modal = 'edit';
  render();
}

function submitSingleCustomer() {
  const nameEl = document.getElementById('singleCustName');
  const cowEl = document.getElementById('singleCustCow');
  const bufEl = document.getElementById('singleCustBuf');

  const name = nameEl ? nameEl.value.trim() : '';
  const cow = cowEl && cowEl.value ? parseFloat(cowEl.value) : 0;
  const buf = bufEl && bufEl.value ? parseFloat(bufEl.value) : 0;

  if (!name) {
    showToast('❌ أدخل اسم الزبون', 'err');
    return;
  }

  if (S.modal === 'edit' && S.editId) {
    const idx = S.customers.findIndex(c => c.id === S.editId);
    if (idx !== -1) {
      S.customers[idx].name = name;
      S.customers[idx].cow = cow;
      S.customers[idx].buffOn = buf > 0;
      S.customers[idx].buff = buf;
      saveCustomers();
      showToast('✅ تم تعديل بيانات الزبون بنجاح', 'ok');
    }
  } else {
    S.customers.push({
      id: uid(),
      name,
      cow,
      buffOn: buf > 0,
      buff,
      addedAt: S.date
    });
    S.customers.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    saveCustomers();
    showToast('✅ تم حفظ الزبون الجديد بنجاح', 'ok');
  }

  closeModal();
}

function confirmDeleteCustomer(id) {
  const c = S.customers.find(x => x.id === id);
  if (!c) return;
  S.confirm = {
    title: 'حذف الزبون',
    msg: `هل تريد حذف "${c.name}" نهائياً من السيستم؟`,
    icon: '🗑️',
    fn: `executeDeleteCustomer('${id}')`
  };
  render();
}

function executeDeleteCustomer(id) {
  S.customers = S.customers.filter(c => c.id !== id);
  saveCustomers();
  closeConfirm();
  showToast('🗑️ تم حذف الزبون بنجاح', 'ok');
}

function confirmCloseWeek() {
  const w = S.week;
  const days = getCycleDays(w.ws);
  S.confirm = {
    title: '🔄 تصفية وإغلاق حساب الأسبوع',
    msg: `هل قمت بتسليم كل الزباين فلوسهم يوم الأربعاء (${formatDateAr(days[6])}) وتريد أرشفة الأسبوع وبدء أسبوع جديد من الخميس؟`,
    icon: '💰',
    btnClass: 'btn-success',
    fn: 'executeCloseWeek()'
  };
  render();
}

function executeCloseWeek() {
  const curWeek = S.week;
  const archived = {
    ...curWeek,
    closed: true,
    closedAt: new Date().toISOString(),
    snapshot: JSON.parse(JSON.stringify(S.customers))
  };

  localSet('week_' + curWeek.ws, archived);

  S.history.push(archived);
  localSet('history', S.history);

  const nextThu = new Date(curWeek.ws + 'T00:00:00');
  nextThu.setDate(nextThu.getDate() + 7);
  const nextWs = nextThu.toISOString().split('T')[0];

  const newWeek = { ws: nextWs, entries: {}, paid: {}, closed: false };
  localSet('week_' + nextWs, newWeek);

  S.week = newWeek;
  S.currentWs = nextWs;
  S.date = nextWs;

  closeConfirm();
  showToast('🎉 تم إغلاق الأسبوع بنجاح وبدء دورة الأسبوع الجديد (من الخميس)!', 'ok');
  goView('home');
}

function navWeek(delta) {
  const d = new Date(S.currentWs + 'T00:00:00');
  d.setDate(d.getDate() + (delta * 7));
  const newWs = d.toISOString().split('T')[0];
  S.currentWs = newWs;

  let w = localGet('week_' + newWs);
  if (!w) {
    w = { ws: newWs, entries: {}, paid: {}, closed: false };
    localSet('week_' + newWs, w);
  }
  S.week = w;
  S.date = newWs;
  render();
}

function shareCustomerWhatsApp(cId) {
  const cust = S.customers.find(c => c.id === cId);
  if (!cust) return;
  const w = S.week;
  const days = getCycleDays(w.ws);
  const res = calcCustomerWeek(cust, w);

  let daysText = '';
  days.forEach(d => {
    const e = (w.entries[cust.id] || {})[d] || {};
    const cow = e.cow || 0;
    const buf = cust.buffOn ? (e.buf || 0) : 0;
    const tot = cow + buf;
    if (tot > 0) {
      daysText += `• ${getDayNameAr(d)}: ${formatKgArabic(tot)}\n`;
    }
  });

  const msg = 
`السلام عليكم يا ${cust.name} 🥛
كشف حساب توريد اللبن من *متجر أبو يوسف للألبان*
📅 الأسبوع: ${getCycleLabel(w.ws)}
-----------------------------
تفاصيل توريدك بالأيام:
${daysText || '• لم تسجل كميات\n'}-----------------------------
🐄 إجمالي لبن بقر: ${res.cowKg.toFixed(2)} كجم (${cust.cow || 0} ج) = ${res.cowAmt.toFixed(2)} ج.م
${cust.buffOn && res.bufKg > 0 ? `🐃 إجمالي لبن جاموس: ${res.bufKg.toFixed(2)} كجم (${cust.buff || 0} ج) = ${res.bufAmt.toFixed(2)} ج.م\n` : ''}-----------------------------
💰 *إجمالي المبلغ المستحق لك يوم الأربعاء: ${res.total.toFixed(2)} ج.م*
شكراً لتعاملكم الطيب معنا! 🙏`;

  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function shareGeneralWhatsApp() {
  const w = S.week;
  let totMoney = 0;
  let totKg = 0;
  S.customers.forEach(c => {
    const r = calcCustomerWeek(c, w);
    totMoney += r.total;
    totKg += r.totalKg;
  });

  const msg = 
`📊 *كشف حساب أسبوع: متجر أبو يوسف للألبان*
📅 ${getCycleLabel(w.ws)}
-----------------------------
👥 عدد الزباين: ${S.customers.length}
🥛 إجمالي كمية اللبن: ${totKg.toFixed(2)} كجم
💰 إجمالي فلوس الأسبوع لتسليم الأربعاء: ${totMoney.toLocaleString('ar-EG')} ج.م
-----------------------------
تاريخ التقرير: ${getDayNameAr(S.date)} ${formatDateAr(S.date)}`;

  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function exportWeekCSV() {
  const w = S.week;
  const days = getCycleDays(w.ws);
  const rows = [];

  rows.push(['الزبون', ...days.map(d => `${getDayNameAr(d)} (${formatDateAr(d)})`), 'إجمالي الكيلو', 'المبلغ ج.م'].join(','));

  S.customers.forEach(c => {
    const res = calcCustomerWeek(c, w);
    const dayCols = days.map(d => {
      const e = (w.entries[c.id] || {})[d] || {};
      return (e.cow || 0) + (e.buf || 0);
    });
    rows.push([`"${c.name}"`, ...dayCols, res.totalKg.toFixed(2), res.total.toFixed(2)].join(','));
  });

  const csv = '\uFEFF' + rows.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = `حساب-أسبوع-${w.ws}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('✅ تم تنزيل ملف Excel بنجاح', 'ok');
}

function downloadBackupJSON() {
  const data = {
    version: '5.0',
    cycle: 'ThursdayToWednesday',
    customers: S.customers,
    week: S.week,
    history: S.history
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `نسخة-أبو-يوسف-${S.date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('💾 تم تنزيل النسخة الاحتياطية', 'ok');
}

function triggerRestoreInput() {
  const f = document.getElementById('restoreFileInput');
  if (f) f.click();
}

function handleRestoreFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (d.customers) { S.customers = d.customers; saveCustomers(); }
      if (d.week) { S.week = d.week; saveWeek(); }
      if (d.history) { S.history = d.history; localSet('history', S.history); }
      closeModal();
      showToast('✅ تم استرجاع البيانات بنجاح', 'ok');
      render();
    } catch (err) { showToast('❌ ملف غير صالح', 'err'); }
  };
  reader.readAsText(file);
}

function goView(v) {
  S.view = v;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let _tTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = `toast-msg show ${type}`;
  clearTimeout(_tTimer);
  _tTimer = setTimeout(() => { el.classList.remove('show'); }, 3000);
}

if ('serviceWorker' in navigator) {
  const swCode = `
    const C='aby-dairy-v5';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      if(e.request.method!=='GET') return;
      e.respondWith(caches.open(C).then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok)c.put(e.request,res.clone());return res;}).catch(()=>r))));
    });
  `;
  try {
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'text/javascript' }))).catch(()=>{});
  } catch(e){}
}

async function start() {
  await loadData();
  render();
}

start();
</script>
